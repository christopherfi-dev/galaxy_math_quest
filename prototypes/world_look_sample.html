<title>Algora New Look</title>
<!--
  Galaxy Math Quest: THE BIG WORLD.  One planet to explore from above.   [Handoff: HANDOFF_Big_World_2026-11-22.md]
  Planet Algora, Galaxy Patternox. Design: proposals/GMQ_Big_World_Design_v1_2026-11-22.md.
  One file. No library, no pictures. Everything is drawn by code. The only thing it fetches is the game's two fonts.
  It keeps its own save (gmq-bigworld-v1). It never writes the game's save.

  HOW IT IS LAID OUT, for the next person or AI:
    MAP-BEGIN .. MAP-END      the map's letters. Painted by checks/bigworld_map_build.js. Do not edit by hand.
    NUM-BEGIN .. NUM-END      every number rule: the machines' rules, the pouch, the pan, the stepping stones. Checked on 20,000 seeds by checks/bigworld_numbers_check.js.
    WORLD-BEGIN .. WORLD-END  the world as data: regions, things, beings, finds, gates, needs. bwCheck() reads it and lists every fault.
    The rest is the engine: drawing, walking, the reading card, the desk, the tasks, saving.
  THE RULES IT KEEPS (CLAUDE.md and the handoff):
    The picture shows the task. The desk holds only words, boxes and buttons.
    The game never does the child's sum: with real pips the child says what will come out BEFORE the machine runs.
    A need goes on the list only when the child talked to someone or looked at something.
    No main job needs a secret. Every gate on the main road has a second way.
-->

/*WORLD-CAST-BEGIN  Elder Thimble and Pim from Marc's Gemini pictures, alive in the village.   [Proposal, 24 November 2026]
  [Source: Marc, 24 November: "Put Elder Thimble and Pim into my copy of the big world now, with breathing, blinking, a hop when they talk, and faces that change with their words"]
  Pictures: prototypes/world_cast_sprites.js (CAST_SPRITES), cut out by prototypes/world_cast_build.py. Note: proposals/GMQ_Character_Test_Results_v1_2026-11-24.md
  - They stand where the game drew them, in the village scene. Nothing they say or do is changed; only how they look.
  - Breathing: a slow, small stretch from the feet. Blinking: every 2.5 to 5 seconds (not in a frame with closed eyes).
  - A hop at each new page of their words, and a small bob while their words are up.
  - Their face follows their words: each line in the game has a feeling (the table below); a new line falls back on its last mark (? thinking, ! happy).
  - Pim, until his spinner is given back: sad. After: playing with it. (What the child did shows in the picture.)
  - "Look: old" on the Ship panel shows the game's own drawing, as today. If a picture has not loaded, the game's own drawing is used. */
const CAST = (() => {
  const NAME = { elder: 'Elder Thimble', pim: 'Pim' }, HEIGHT = { elder: 2.3, pim: 1.7 };      /* on-screen height of the calm frame, in the scene's r (about 130 and 95 pixels on an iPad held sideways); taller, the elder covers the pip store */
  const IMG = {};
  Object.keys(CAST_SPRITES).forEach(c => Object.keys(CAST_SPRITES[c].frames).forEach(f => { const im = new Image(); im.src = CAST_SPRITES[c].frames[f].src; IMG[c + '.' + f] = im; }));
  /* each line they say, and the face that goes with it [Proposal: the feelings are Claude's reading of each line] */
  const LINES = {
    elder: [[/^Sky visitor! Welcome/, 'happy'], [/^The Makers built machines/, 'thinking'], [/burnt black|ate some of our pips|went up when the Gate broke|planning, and it burnt/, 'worried'],
      [/^You found a rule|^All four plates are true|^What is that\?|^It is a piece of the Gate/, 'surprised'],
      [/^The bridge has a lock|^The Makers made it so|^Its light flies|^This is no machine|^Was the rule|^So I poured in 3|^The bridge pan still waits/, 'thinking'],
      [/^You know how already|^Look: our Rule Stone|^And for you|^You have made|^Long ago I found|^3 times 4 is 12/, 'happy'],
      [/^Four machines stand|^Here are our last|^Use only a machine|^The other four|^Keep it safe|^The Rillfolk are over|^I poured in 2|^Now you\./, 'idle']],
    pim: [[/lost my spinner/, 'sad'], [/That is my spinner|You found it|I will write back/, 'joy'], [/Want a secret|Shh|Push the old post|The big kids cross/, 'secret'],
      [/^Whee! Look at it spin/, 'spinner'], [/count to 100 by fives|A bottle\? With a note|Wim!/, 'excited'], [/^Hello! I am Pim\.$/, 'idle']] };
  const st = {};
  Object.keys(NAME).forEach((c, i) => { st[c] = { page: '', hop: -9, blinkAt: 1.5 + i * 1.7, phase: i * 1.3 }; });
  function faceFor(c, text) { for (const [re, f] of LINES[c]) if (re.test(text)) return f; return /\?\s*$/.test(text) ? 'thinking' : /!/.test(text) ? 'happy' : 'idle'; }
  function rest(c) { return c === 'pim' ? (flag('spinGiven') ? 'spinner' : 'sad') : 'idle'; }
  function speaking(c) { return reading() && READ.who === NAME[c]; }
  /* draw one of them with the feet on the line base, at x X; r is the scene's size. Returns false to let the game draw its own. */
  function draw(c, X, base, r) {
    if (!WL.on || !CAST_SPRITES[c]) return false;
    const s = st[c], talk = speaking(c), text = talk ? READ.q[READ.i] || '' : '', key = talk ? READ.i + '|' + text : '';
    if (key && key !== s.page) s.hop = tNow; s.page = key;
    const fname = talk ? faceFor(c, text) : rest(c), fr = CAST_SPRITES[c].frames[fname] || CAST_SPRITES[c].frames.idle, im = IMG[c + '.' + (CAST_SPRITES[c].frames[fname] ? fname : 'idle')];
    if (!im || !im.complete || !im.naturalWidth) return false;

function openPanel(p) { if (reading() || TASK) return; PANEL = PANEL === p ? '' : p; if (p === 'needs') $('b_needs').classList.remove('new'); $('b_needs').classList.toggle('on', PANEL === 'needs'); $('b_ship').classList.toggle('on', PANEL === 'ship' || PANEL === 'report'); drawWords(); drawTask(); }
function panelHtml() {
  if (PANEL === 'needs') { const open = S.needs.filter(n => !n.done && !n.later), later = S.needs.filter(n => !n.done && n.later), done = S.needs.filter(n => n.done), carry = S.bag.map(i => i === 'pouch' ? (S.pouch === null ? '' : `the pip pouch (${S.pouch} pips)`) : ITEMS[i].name).filter(Boolean);
    return `<h3>What I still need</h3><ul class="list"><li><b>My mission:</b> mend the Gate, so Patternox is open to everyone.<small>Rule Stones lit: ${S.lit} of 5</small></li></ul>${open.length || later.length || done.length ? '' : '<p class="dim">Nothing else yet. Talk to people. Look at things.</p>'}<ul class="list">${open.map(n => `<li>${esc(n.text)}</li>`).join('')}${later.map(n => `<li>${esc(n.text)}<small>for another day</small></li>`).join('')}${done.map(n => `<li class="done">${esc(n.text)}</li>`).join('')}</ul><p class="q"><b>I carry:</b> ${carry.length ? esc(carry.join(', ')) : 'nothing yet'}</p>${Object.keys(S.notes).filter(s => S.notes[s].length).map(s => `<p class="dim">${esc(s === 'box' ? 'The Makers\' box' : cap(siteName(s)))}</p>${notesHtml(s)}`).join('')}<div class="brow">${btn('close', 'Close', 'quiet')}</div>`; }
  if (PANEL === 'report') return `<h3>Mission report</h3><p class="dim">For your teacher: what you did, the maths, and how it went.</p><ul class="list">${S.log.length ? S.log.slice().reverse().map(l => `<li>${esc(l.what)}<small>${esc([l.maths, l.result, 'minute ' + l.t].filter(Boolean).join(' · '))}</small></li>`).join('') : '<li>Nothing yet.</li>'}</ul><div class="brow">${btn('ship', 'Back', 'quiet')}</div>`;
  const atShip = S.at === 'map' && Math.abs(Math.round(P.px) - 13) + Math.abs(Math.round(P.py) - 82) <= 1;
  /* the buttons come first, so a long list of cards can never push Close off the screen */
  const up = Object.keys(PARTS).filter(k => (S.parts || {})[k]), base = Object.keys(PARTS).filter(k => !(S.parts || {})[k]);
  return `<h3>Your ship</h3><p class="q">${atShip ? 'Your ship waits here. Everything you do is saved by itself.' : 'Your ship is in the meadow where you landed.'} Rule Stones lit: ${S.lit} of 5.</p><div class="brow four">${atShip || S.at !== 'map' ? '' : btn('home', 'Go back to my ship', 'warm')}${btn('report', 'Mission report', 'quiet')}${btn('sound', 'Sound: ' + (S.sound ? 'on' : 'off'), 'quiet')}${btn('music', 'Music: ' + (MUS.on ? 'on' : 'off'), 'quiet')}${btn('look', 'Look: ' + (WL.on ? 'new' : 'old'), 'quiet')}${btn('close', 'Close', 'quiet')}${btn('reset', 'Start again', 'quiet')}</div><p class="q"><b>Ship parts:</b> ${up.map(k => PARTS[k] + ' <b>Level 2</b>').join(', ')}${up.length && base.length ? '. ' : ''}${base.length ? 'Level 1: ' + base.map(k => PARTS[k]).join(', ') : ''}</p><p class="q"><b>Cards won on Algora:</b> ${S.cards.length ? S.cards.map(c => c.epic ? '<b>' + esc(c.name) + ' (EPIC)</b>' : esc(c.name)).join(', ') : 'none yet'}</p><p class="dim">More of Algora is coming. (${VERSION})</p>`; }

window.addEventListener('keydown', e => { if (e.target === $('cmd')) return; if (!TASK && !PANEL && !reading() && !PIC && !BIG && /^[a-z]$/i.test(e.key) && !e.metaKey && !e.ctrlKey) { $('cmd').focus(); return; } if (reading() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return readOk(); }      /* readOk shakes the card while OK sleeps */ if (TASK && BOX.on && /^[0-9]$/.test(e.key)) return padKey(e.key); if (TASK && e.key === 'Backspace') return padKey('del'); const d = { ArrowUp: 'north', ArrowDown: 'south', ArrowRight: 'east', ArrowLeft: 'west' }[e.key]; if (d && !TASK && !reading() && !PIC && !BIG && S.at === 'map') { e.preventDefault(); const v = { north: [0, -1], south: [0, 1], east: [1, 0], west: [-1, 0] }[d], x = Math.round(P.px) + v[0], y = Math.round(P.py) + v[1]; if (!P.route.length && walkable(x, y)) { P.route = [[x, y]]; P.then = null; } } });
window.addEventListener('resize', size); window.addEventListener('resize', () => { if (reading() && !$('read').hidden) placeRead($('read')); });      /* the card keeps its place when the iPad turns */

/* ---- what a future AI may be told about this place: facts only, from the tables above and the save. [CLAUDE.md: the constraint architecture] */
function bwSlice() { const r = regAt(Math.round(P.px), Math.round(P.py)), R = REGIONS[r] || REGIONS[1], near = hereThings().map(t => t.name); return ['PLACE: ' + hereName() + ', ' + PLANET + ', Galaxy Patternox', 'FOLK: ' + (R.folk || ''), 'NEAR: ' + (near.join('; ') || 'nothing'), 'CARRIES: ' + (S.bag.map(i => ITEMS[i].name).join('; ') || 'nothing') + (S.pouch !== null ? ` (${S.pouch} pips)` : ''), 'NEEDS: ' + (S.needs.filter(n => !n.done).map(n => n.text).join(' | ') || 'none'), `FACTS: plates made ${platesDone()} of 4; bridge ${S.gates.bridge ? 'down' : 'up'}; old stones ${S.gates.stones ? 'crossed' : 'not crossed'}; Rule Stones lit ${S.lit} of 5`, 'NEVER SAY: any machine\'s rule, the number that will come out, or which stone is next'].join('\n'); }

/* ---- start, and the frame loop */
function boot() { kbBuild(); S = load() || fresh(); { const nm = x => typeof x === 'string' ? x.replace(/Elder Rivet/g, 'Elder Thimble') : x; (S.needs || []).forEach(q => { q.text = nm(q.text); }); (S.log || []).forEach(l => { l.what = nm(l.what); l.maths = nm(l.maths); l.result = nm(l.result); }); }      /* a game saved before the elder was renamed (24 November) */ if (!S.st) S.st = { round: 0, row: 0 }; S.parts = S.parts || {}; if (S.flags.stoneLit && !S.parts.engine) S.parts.engine = 2;      /* a save from before upgrades */ NUM = bwNumbers(S.seed); FLEET = bwFleet(S.seed); WELL = bwWell(S.seed); S.tags = S.tags || {}; S.fleet = S.fleet || { plan: {}, sends: 0, lamps: null, tab: 'stilt' }; TOWNS.forEach(t => { S.fleet.plan[t] = S.fleet.plan[t] || { k: 0, n: 0 }; }); S.well = S.well || { step: 0, turns: 0, hit: false, told: 0 }; S.steps = S.steps || 0; unpackSeen(S.seen); P.px = S.x; P.py = S.y; P.dir = S.dir || 'down'; cam.x = S.x + .5; cam.y = S.y + .5; SC.x = S.sx || .13; see(); size(); setPlace(); drawLog(); drawWords(); drawTask();
  const faults = bwCheck(); if (faults.length) console.error('bwCheck: ' + faults.join(' | '));
  if (S.intro < 9) { PIC = introPic(); setPlace(); tell(['The wormhole to Galaxy Patternox is broken. It flickers.', 'A small ship can slip through a flicker. A big ship cannot.', 'A call comes through the flicker: “This is the S.S. Infinity. We are lost in Patternox. The Gate\'s code is broken. Please help.”', 'Past the wormhole is one planet with two suns: ' + PLANET + '.', 'Your mission: find out why the Gate broke. Mend it. Then Patternox is open to everyone.', 'You land in a green meadow. Tap the picture to walk. Tap a word to do something.'], () => { S.intro = 9; PIC = null; report('Landed on ' + PLANET, '', ''); setPlace(); drawWords(); save(); if (!flag('lessonDone') && !flag('metElder')) startLesson(); }, 'Mission'); }
  else if (!flag('lessonDone') && !flag('metElder')) startLesson();      /* landed, but the lesson is not done: it comes first */
  else if (S.open) { const o = S.open; if (o.kind === 'machine' && TH['m_' + o.site]) openMachine(o.site); else if (o.kind === 'pan' && !S.gates.bridge && S.pouch !== null) { TASK = { kind: 'pan', msg: '', title: 'The bridge pan' }; PIC = panPic(); drawWords(); drawTask(); setPlace(); } else if (o.kind === 'fleet' && !flag('fleetDone')) { TASK = { kind: 'fleet', msg: '', title: 'The loading board' }; BOX.v = { n: S.fleet.plan[S.fleet.tab].n ? String(S.fleet.plan[S.fleet.tab].n) : '' }; BOX.on = 'n'; PIC = fleetPic(); drawWords(); drawTask(); setPlace(); } else if (o.kind === 'box' && S.well.step === 6) { TASK = { kind: 'box', phase: 'test', msg: '', title: 'The Makers\' box' }; BOX.v = {}; BOX.on = 'in'; PIC = boxPic(); drawWords(); drawTask(); setPlace(); } else if (o.kind === 'stones' && !S.gates.stones) { TASK = { kind: 'stones', msg: '', title: 'The old stepping stones' }; PIC = stonesPic(); drawWords(); drawTask(); setPlace(); } else S.open = null; }
  requestAnimationFrame(loop); }
let last = 0;
function loop(ts) { const dt = Math.min(.05, last ? (ts - last) / 1000 : .016); last = ts; tNow += dt; if (READ.held && reading() && !(PIC && PIC.busy && PIC.busy())) showRead(); if (cv.clientWidth !== vw || cv.clientHeight !== vh) size();
  if (reading() && READ.hook && READ.hook[READ.i]) { READ.hook[READ.i](); }
  if (PIC && PIC.inset) { const top = 56, bot = 8; PICTOP = top;      /* the card sits beside or below the picture, so a finished example keeps its whole place */ cx.fillStyle = PIC.inset; cx.fillRect(0, 0, vw, vh); cx.save(); cx.translate(0, top); PIC.draw(vw, vh - top - bot, dt); cx.restore(); } else if (PIC) PIC.draw(vw, vh, dt); else if (BIG) drawBig(); else if (S.at === 'map') { stepWalk(dt); cam.x += (P.px + .5 - cam.x) * Math.min(1, dt * 6); cam.y += (P.py + .5 - cam.y) * Math.min(1, dt * 6); drawMap(dt); } else drawScene(dt);
  if (FADE > 0) { cx.fillStyle = `rgba(4,6,14,${Math.min(1, FADE)})`; cx.fillRect(0, 0, vw, vh); FADE -= dt * 2.4; }
  requestAnimationFrame(loop); }
window.__bw = { S: () => S, NUM: () => NUM, P, SC, MA, READ, check: bwCheck, slice: bwSlice, pic: () => PIC, task: () => TASK, panel: () => PANEL, big: () => BIG, idle: () => !P.route.length && SC.to === null && !MA.phase && FADE <= 0, seen, walkable, tell, things: TH, stones: bwStones, cam: () => { geo(); return { ts: V.ts, ox: V.ox, oy: V.oy }; } };
boot();
