<!--
  Galaxy Math Quest: THE BIG WORLD.  One planet to explore from above.   [Handoff: HANDOFF_Big_World_2026-11-22.md]
  Planet Algora, Galaxy Patternox. Design: proposals/GMQ_Big_World_Design_v1_2026-11-22.md.
  One file. No library, no pictures, no network. Everything is drawn by code.
  It keeps its own save (gmq-bigworld-v1). It never writes the game's save.

  HOW IT IS LAID OUT, for the next person or AI:
    MAP-BEGIN .. MAP-END      the map's letters. Painted by checks/bigworld_map_build.js. Do not edit by hand.
    NUM-BEGIN .. NUM-END      every number rule: the machines' rules, the pouch, the pan, the stepping stones. Checked on 20,000 seeds by checks/bigworld_numbers_check.js.
    WORLD-BEGIN .. WORLD-END  the world as data: regions, things, beings, finds, gates, needs. bwCheck() reads it and lists every fault.
    The rest is the engine: drawing, walking, the reading card, the desk, the tasks, saving.
  THE RULES IT KEEPS (CLAUDE.md and the handoff):
    The picture shows the task. The desk holds only words, boxes and buttons.
    The game never does the child's sum: with real pips the child says what will come out BEFORE the machine runs.
    A need goes on the list only when the child talked to someone or looked at something.
    No main job needs a secret. Every gate on the main road has a second way.
-->

/* ---- lists on the desk: what I still need, and the ship */
function openPanel(p) { if (reading() || TASK) return; PANEL = PANEL === p ? '' : p; if (p === 'needs') $('b_needs').classList.remove('new'); $('b_needs').classList.toggle('on', PANEL === 'needs'); $('b_ship').classList.toggle('on', PANEL === 'ship' || PANEL === 'report'); drawWords(); drawTask(); }
function panelHtml() {
  if (PANEL === 'needs') { const open = S.needs.filter(n => !n.done && !n.later), later = S.needs.filter(n => !n.done && n.later), done = S.needs.filter(n => n.done), carry = S.bag.map(i => i === 'pouch' ? (S.pouch === null ? '' : `the pip pouch (${S.pouch} pips)`) : ITEMS[i].name).filter(Boolean);
    return `<h3>What I still need</h3><ul class="list"><li><b>My mission:</b> mend the Gate, so Patternox is open to everyone.<small>Rule Stones lit: ${S.lit} of 5</small></li></ul>${open.length || later.length || done.length ? '' : '<p class="dim">Nothing else yet. Talk to people. Look at things.</p>'}<ul class="list">${open.map(n => `<li>${esc(n.text)}</li>`).join('')}${later.map(n => `<li>${esc(n.text)}<small>for another day</small></li>`).join('')}${done.map(n => `<li class="done">${esc(n.text)}</li>`).join('')}</ul><p class="q"><b>I carry:</b> ${carry.length ? esc(carry.join(', ')) : 'nothing yet'}</p>${Object.keys(S.notes).filter(s => S.notes[s].length).map(s => `<p class="dim">${esc(cap(siteName(s)))}</p>${notesHtml(s)}`).join('')}<div class="brow">${btn('close', 'Close', 'quiet')}</div>`; }
  if (PANEL === 'report') return `<h3>Mission report</h3><p class="dim">For your teacher: what you did, the maths, and how it went.</p><ul class="list">${S.log.length ? S.log.slice().reverse().map(l => `<li>${esc(l.what)}<small>${esc([l.maths, l.result, l.t + ' min'].filter(Boolean).join(' · '))}</small></li>`).join('') : '<li>Nothing yet.</li>'}</ul><div class="brow">${btn('ship', 'Back', 'quiet')}</div>`;
  const atShip = S.at === 'map' && Math.abs(Math.round(P.px) - 13) + Math.abs(Math.round(P.py) - 82) <= 1;
  return `<h3>Your ship</h3><p class="q">${atShip ? 'Your ship waits here. Everything you do is saved by itself.' : 'Your ship is in the meadow where you landed.'}</p><div class="brow">${atShip || S.at !== 'map' ? '' : btn('home', 'Go back to my ship', 'warm')}${btn('report', 'Mission report', 'quiet')}${btn('sound', 'Sound: ' + (S.sound ? 'on' : 'off'), 'quiet')}</div><p class="q"><b>Cards won on Algora:</b> ${S.cards.length ? esc(S.cards.map(c => c.name).join(', ')) : 'none yet'}</p><div class="brow">${btn('close', 'Close', 'quiet')}${btn('reset', 'Start again', 'quiet')}</div><p class="dim">Rule Stones lit: ${S.lit} of 5. Only the Mender Meadow and the Reach's landing are built so far. More of Algora is coming. (${VERSION})</p>`; }
function panelPress(b) { if (b === 'close') return openPanel(PANEL); if (b === 'report' || b === 'ship') { PANEL = b; return drawTask(); } if (b === 'sound') { S.sound = !S.sound; save(); beep(600, .08); return drawTask(); }
  if (b === 'home') { openPanel(PANEL); FADE = 1; P.route = []; P.then = null; P.px = 13; P.py = 82; P.dir = 'down'; cam.x = 13.5; cam.y = 82.5; see(); note('You follow your own tracks back to the ship.'); save(); drawWords(); return setPlace(); }
  if (b === 'reset') { PANEL = ''; $('b_ship').classList.remove('on'); TASK = { kind: 'reset', title: 'Start again?' }; drawWords(); return drawTask(); } }
function toggleBig() { if (reading() || TASK || PIC) return; BIG = !BIG; $('b_map').classList.toggle('on', BIG); if (BIG) { PANEL = ''; $('b_needs').classList.remove('on'); $('b_ship').classList.remove('on'); } drawWords(); drawTask(); setPlace(); }

/* ---- taps and keys */
function stageTap(e) { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; if (reading()) return; if (BIG) return toggleBig(); if (PIC) { if (PIC.tap) PIC.tap(x, y); return; } if (TASK) return; if (PANEL) openPanel(PANEL);
  if (S.at !== 'map') { const sc = SCENES[S.at], fx = x / vw; let best = null; for (const t of sc.things) if (Math.abs(t.x - fx) < .075 && (!best || Math.abs(t.x - fx) < Math.abs(best.x - fx))) best = t; if (best) return runThing(best, verb); SC.to = clamp(fx, .05, .95); SC.then = null; return; }
  geo(); const tx = Math.floor(V.ox + x / V.ts), ty = Math.floor(V.oy + y / V.ts); if (tx < 0 || ty < 0 || tx >= MAPW || ty >= MAPH) return; let t = seen[key(tx, ty)] ? SOLID[key(tx, ty)] : null; if (!t && seen[key(tx, ty)]) { const g = GATEOF[key(tx, ty)]; if (g && !gateOpen(g)) t = THINGS.find(o => o.gate === g); if (!t && MAP[ty][tx] === 'H') t = TH.village; if (!t && Math.abs(tx - 13) <= 1 && ty === 83) t = TH.ship; } if (t && thingSeen(t)) return runThing(t, verb); verb = ''; beep(500, .03); goTo(tx, ty); drawWords(); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); stageTap(e); });

$('read').addEventListener('pointerdown', e => e.stopPropagation());
$('b_map').onclick = toggleBig; $('b_needs').onclick = () => { if (BIG) toggleBig(); openPanel('needs'); }; $('b_ship').onclick = () => { if (BIG) toggleBig(); openPanel('ship'); };
$('words').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || reading()) return; if (b.dataset.verb) { verb = verb === b.dataset.verb ? '' : b.dataset.verb; $('cmd').value = verb ? verb + ' ' : ''; beep(560, .03); return drawWords(); } if (b.dataset.dir) return goDir(b.dataset.dir); if (b.dataset.thing) { const t = hereThings().find(o => o.id === b.dataset.thing); if (t) runThing(t, verb); } });
$('task').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || reading()) return; if (b.dataset.k) return padKey(b.dataset.k); if (b.dataset.box) { BOX.on = b.dataset.box; return drawTask(); } if (b.dataset.sign) { TASK.sign = b.dataset.sign; TASK.msg = ''; beep(560, .03); return drawTask(); } if (b.disabled) return; if (b.dataset.b) { if (PANEL) return panelPress(b.dataset.b); if (TASK) TASKS[TASK.kind].press(b.dataset.b); } });
$('go').onclick = () => command($('cmd').value); $('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') command($('cmd').value); });
window.addEventListener('keydown', e => { if (e.target === $('cmd')) return; if (reading() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return readOk(); } if (TASK && BOX.on && /^[0-9]$/.test(e.key)) return padKey(e.key); if (TASK && e.key === 'Backspace') return padKey('del'); const d = { ArrowUp: 'north', ArrowDown: 'south', ArrowRight: 'east', ArrowLeft: 'west' }[e.key]; if (d && !TASK && !reading() && !PIC && !BIG && S.at === 'map') { e.preventDefault(); const v = { north: [0, -1], south: [0, 1], east: [1, 0], west: [-1, 0] }[d], x = Math.round(P.px) + v[0], y = Math.round(P.py) + v[1]; if (!P.route.length && walkable(x, y)) { P.route = [[x, y]]; P.then = null; } } });
window.addEventListener('resize', size);

/* ---- what a future AI may be told about this place: facts only, from the tables above and the save. [CLAUDE.md: the constraint architecture] */
function bwSlice() { const r = regAt(Math.round(P.px), Math.round(P.py)), R = REGIONS[r] || REGIONS[1], near = hereThings().map(t => t.name); return ['PLACE: ' + hereName() + ', ' + PLANET + ', Galaxy Patternox', 'FOLK: ' + (R.folk || ''), 'NEAR: ' + (near.join('; ') || 'nothing'), 'CARRIES: ' + (S.bag.map(i => ITEMS[i].name).join('; ') || 'nothing') + (S.pouch !== null ? ` (${S.pouch} pips)` : ''), 'NEEDS: ' + (S.needs.filter(n => !n.done).map(n => n.text).join(' | ') || 'none'), `FACTS: plates made ${platesDone()} of 4; bridge ${S.gates.bridge ? 'down' : 'up'}; old stones ${S.gates.stones ? 'crossed' : 'not crossed'}; Rule Stones lit ${S.lit} of 5`, 'NEVER SAY: any machine\'s rule, the number that will come out, or which stone is next'].join('\n'); }

/* ---- start, and the frame loop */
function boot() { S = load() || fresh(); if (!S.st) S.st = { round: 0, row: 0 }; NUM = bwNumbers(S.seed); unpackSeen(S.seen); P.px = S.x; P.py = S.y; P.dir = S.dir || 'down'; cam.x = S.x + .5; cam.y = S.y + .5; SC.x = S.sx || .13; see(); size(); setPlace(); drawLog(); drawWords(); drawTask();
  const faults = bwCheck(); if (faults.length) console.error('bwCheck: ' + faults.join(' | '));
  if (S.intro < 9) { PIC = introPic(); setPlace(); tell(['The wormhole to Galaxy Patternox is broken. It flickers.', 'A small ship can slip through a flicker. A big ship cannot.', 'A call comes through the flicker: “This is the S.S. Infinity. We are lost in Patternox. The Gate\'s code is broken. Please help.”', 'Past the wormhole is one planet with two suns: ' + PLANET + '.', 'Your mission: find out why the Gate broke. Mend it. Then Patternox is open to everyone.', 'You land in a green meadow. Tap the picture to walk. Tap a word to do something.'], () => { S.intro = 9; PIC = null; report('Landed on ' + PLANET, '', ''); setPlace(); drawWords(); save(); }, 'Mission'); }
  else if (S.open) { const o = S.open; if (o.kind === 'machine' && TH['m_' + o.site]) openMachine(o.site); else if (o.kind === 'pan' && !S.gates.bridge && S.pouch !== null) { TASK = { kind: 'pan', msg: '', title: 'The bridge pan' }; PIC = panPic(); drawWords(); drawTask(); setPlace(); } else if (o.kind === 'stones' && !S.gates.stones) { TASK = { kind: 'stones', msg: '', title: 'The old stepping stones' }; PIC = stonesPic(); drawWords(); drawTask(); setPlace(); } else S.open = null; }
  requestAnimationFrame(loop); }
let last = 0;
function loop(ts) { const dt = Math.min(.05, last ? (ts - last) / 1000 : .016); last = ts; tNow += dt; if (cv.clientWidth !== vw || cv.clientHeight !== vh) size();
  if (reading() && READ.hook && READ.hook[READ.i]) { READ.hook[READ.i](); }
  if (PIC) PIC.draw(vw, vh, dt); else if (BIG) drawBig(); else if (S.at === 'map') { stepWalk(dt); cam.x += (P.px + .5 - cam.x) * Math.min(1, dt * 6); cam.y += (P.py + .5 - cam.y) * Math.min(1, dt * 6); drawMap(dt); } else drawScene(dt);
  if (FADE > 0) { cx.fillStyle = `rgba(4,6,14,${Math.min(1, FADE)})`; cx.fillRect(0, 0, vw, vh); FADE -= dt * 2.4; }
  requestAnimationFrame(loop); }
window.__bw = { S: () => S, NUM: () => NUM, P, SC, MA, READ, check: bwCheck, slice: bwSlice, pic: () => PIC, task: () => TASK, panel: () => PANEL, big: () => BIG, idle: () => !P.route.length && SC.to === null && !MA.phase && FADE <= 0, seen, walkable, tell, things: TH, stones: bwStones, cam: () => { geo(); return { ts: V.ts, ox: V.ox, oy: V.oy }; } };
boot();
