<script>
/* ===== GMQ FLY-IN: start =====
   The arrival at Planet Voltara. One entry point:  GMQFlyin.play(canvas, opts, done)
     canvas  a canvas of its own, laid over the game's picture (the game's own canvas is 2D and cannot be shared)
     opts    { view: 'outside'  the ship is seen from outside all the way. Left out: first person, from the cockpit, and the ship is seen only once it has landed
               short: true      the two-second one, for later landings
               fade: true       in the last half second the canvas fades out, to show what lies under it (the game's meadow)
               hold: true       keep the last picture alive after the end (this page uses it; the game would not)
               clock: seconds   the game's own clock (tNow), so clouds, moons and sparkles carry on from where the game has them
               sp: [x, y]       where the ship is on the space map (the game's SP), so the stars sit where the game has them
               beacon: false    the trade beacon is silent (the game's tradeOpen() is false)
               lit: {R,C,I}     how much of each street is lit, 0 to 1 (a saved city); tower: true lights the Power Plaza tower
               q: 0..3          fix the picture size; left out, it starts sharp and steps down by itself when frames come slow
               t: seconds       hold the picture at one moment (for review pictures) }
     done    called once, with why it ended: 'end', 'skip', 'nowebgl', 'slowstart', 'hidden' or 'lost'
   It never blocks: a tap skips it, no WebGL 2 ends it at once, and a timer ends it even if the browser stops drawing.
   It makes no sound, reads no saved state and writes none. Nothing is made anew in a frame: everything is set up once.
   How it is drawn: space and the planet are one small shader, with the colours, bands and clouds of the game's voltaraBall.
   Everything else is the game's own drawing (spaceBack, rocket, farCity, towerDraw, vSky, vFar, drawMeadow, alienTree, fluff,
   frontMeadow), painted once, at this picture's own size and with the game's own line weights, into one texture as flat cards.

  var SKY = ['#2c2a8f', '#6a4fd0', '#c26fe8', '#ff8fb1', '#ffb86b', '#ffe58a', '#c8f5c9'];

  /* ---------- the three small programs for the graphics chip ---------- */

    '  vec3 c = mix(' + v3('#49a888') + ', ' + v3('#3a8f76') + ', clamp((v - ' + HZ + ') / .1, 0., 1.));',

    '  for (int k = 0; k < 2; k++) { float md = k == 0 ? 1.45 : 1.75, an = uT * .15 + (k == 0 ? 0. : 2.6), mr = k == 0 ? .09 : .055;',

    '    int i = int(fi);',
    '    vec3 pc = mix(BAND[i], BAND[min(i + 1, 7)], smoothstep(1. - 5. * px, 1., f - fi));',
    '    for (int k = 0; k < 4; k++) { float fk = float(k); vec2 q = p - vec2(sin(fk * 2.1) * .4, .5 - fk * .33), qe = q / vec2(.16, .05); float lq = length(qe);',     // four thin swirls
    '      float ds = abs(lq - 1.) * lq / max(.001, length(qe / vec2(.16, .05))); pc = mix(pc, vec3(1.), .3 * RS(.01 + px, .01 - px, ds) * step(mod(atan(-q.y, q.x) + 6.2832, 6.2832), 5.)); }',
    '    float cm = 0.;',
    '    for (int k = 0; k < 11; k++) { float fk = float(k), u = mod(fk * .137 + uT * .012, 1.3) - .15, sq = max(.25, 1. - abs(u - .5) * 1.5);',                        // eleven cotton-candy clouds drift across, white and pink
    '      vec2 c = vec2(-1. + u * 2., .78 - mod(fk * 53., 100.) / 100. * 1.56);',
    '      float a = max(RS(1. + px * 20., 1. - px * 20., length((p - c) / vec2(.2 * sq, .05))), RS(1. + px * 25., 1. - px * 25., length((p - c - vec2(.08 * sq, .035)) / vec2(.11 * sq, .04))));',

    '    float sa = dd < 1.325 ? mix(0., .5, clamp((dd - .8) / .525, 0., 1.)) : mix(.5, .95, clamp((dd - 1.325) / .525, 0., 1.));',
    '    sa = mix(sa, min(.9, sa * 1.95), uZ);',                                                       // close up, the night is deeper
    '    pc = mix(pc, vec3(.039, .02, .188), sa);',
    '    if (uZ > 0.) {',                                                                              // down there in the night: woods of glowing trees, and the Sparkling River
    '      float dark = clamp(smoothstep(.25, .5, sa) * (1. - cm), 0., 1.) * uZ;',
    '      float ry = p.y - (' + CITYP[1] + ' - .07 + .01 * sin(p.x * 30.) + .016 * sin(p.x * 11.)), rw = RS(.017 + px, .017 - px, abs(ry));',

    '      vec2 rg = p * 300., ri = floor(rg); float rh = h2(ri);',
    '      pc = mix(pc, vec3(.16, .42, .78) + vec3(.9) * step(.84, rh) * max(0., sin(uT * 4. + rh * 40.)) * RS(.4, .2, length(rg - ri - .5)), dark * rw * .9);',
    '    }',
    '    float ra = mod(atan(-p.y, p.x) + 6.2832, 6.2832);',
    '    if (ra > 2.5 && ra < 4.9) pc = mix(pc, vec3(1., .882, .961), .65 * smoothstep(.975, .99, d));',

    '  }',
    '  o = vec4(mix(col, vec3(.86, .62, .93), uH), 1.);', '}'].join('\n');
