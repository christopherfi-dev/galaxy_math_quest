<script>
/* ===== GMQ FLY-IN: start =====
   The arrival at Planet Voltara. One entry point:  GMQFlyin.play(canvas, opts, done)
     canvas  a canvas of its own, laid over the game's picture (the game's own canvas is 2D and cannot be shared)
     opts    { short: true      the two-second one, for later landings
               fade: true       in the last half second the canvas fades out, to show what lies under it (the game's meadow)
               hold: true       keep the last picture alive after the end (this page uses it; the game would not)
               q: 0..3          fix the picture size; left out, it starts sharp and drops by itself when frames come slow
               t: seconds       hold the picture at one moment (for review pictures)
               lit: {R,C,I}     how much of each street is lit, 0 to 1 (a saved city); tower: true lights the Power Plaza tower }
     done    called once, with why it ended: 'end', 'skip', 'nowebgl', 'slowstart', 'hidden' or 'lost'
   It never blocks: a tap skips it, no WebGL 2 ends it at once, and a timer ends it even if the browser stops drawing.
   It makes no sound, reads no saved state and writes none. Nothing is made anew in a frame: everything is set up once.
   How it is drawn: the planet from orbit is one small shader, with the colours of the game's voltaraBall. The landing is the
   game's own meadow picture (vSky, vFar, farCity, drawMeadow, frontMeadow), painted once into one texture as flat cards and
   stood up in 3D like a paper theatre. The camera comes down to the exact view the game draws, so the last frame is that picture. */
var GMQFlyin = (function () {

  var HZ = .56, GY = .86, F = 1, EYE = 3, PAR = -.37;      // the meadow as the game draws it: horizon and ground rows, the lens, eye height, and the cadet standing at .13
  var INK = '#0e1626', SCALES = [1.5, 1.25, 1, .75], MAXQ = 440, AW = 2048, AH = 1024;
  var CITYP = [.44, -.44];                                  // where the city is on the ball from orbit, in the night
  var NEB = [[.22, .3, '#7a3fd0', .42], [.8, .26, '#4a2f9e', .36], [.82, .76, '#1f5fd0', .44], [.2, .8, '#1f9e6a', .38], [.5, .12, '#d0503f', .36], [.5, .56, '#c98a2f', .3], [.6, .9, '#a02f7a', .4]];
  var SKY = ['#2c2a8f', '#6a4fd0', '#c26fe8', '#ff8fb1', '#ffb86b', '#ffe58a', '#c8f5c9'];
  var G = null, ERR = '';

  /* ---------- the three small programs for the graphics chip ---------- */

  var FS_GROUND = ['#version 300 es', 'precision highp float;', 'uniform float uA, uT, uK;', 'in vec2 vU; in vec4 vC; out vec4 o;',
    'float h2(vec2 p){ p = fract(p * vec2(.1031, .1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.y); }',
    'float RS(float hi, float lo, float x){ return 1. - smoothstep(lo, hi, x); }',
    'float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h2(i), h2(i + vec2(1, 0)), f.x), mix(h2(i + vec2(0, 1)), h2(i + vec2(1, 1)), f.x), f.y); }',
    'void main(){',
    '  float z = max(vU.y, .05), v = vU.y > .5 ? ' + HZ + ' + ' + (F * EYE).toFixed(2) + ' / z : 3., u = .5 + ' + F.toFixed(1) + ' * vU.x / (z * uA), e = fwidth(v) + .0004;',
    '  vec3 c = mix(' + v3('#49a888') + ', ' + v3('#3a8f76') + ', clamp((v - ' + HZ + ') / .1, 0., 1.));',
    '  c = mix(c, vec3(.66, .9, .76), smoothstep(250., 2600., z));',                                                         // far away the land pales into the sky
    '  vec2 tq = vU / 8., ti = floor(tq); float th = h2(ti + 3.), tr = .12 + .2 * h2(ti + 9.);',                                 // seen from the air only: glowing trees dotted over the far bank
    '  c += uK * step(46., z) * RS(900., 300., z) * step(.74, th) * RS(260., 180., z) * vec3(.16, .46, .36) * RS(tr, tr * .3, length(tq - ti - .3 - .4 * vec2(h2(ti + 1.), h2(ti + 2.))));',
    '  c = mix(c, ' + v3('#143a33') + ', smoothstep(-e, e, v - .66));',
    '  float top = .633 + .007 * sin(u * 9. + uT), bot = .735 + .007 * sin(u * 7. - uT);',
    '  vec3 rv = mix(' + v3('#59c4f0') + ', ' + v3('#2f7fd0') + ', clamp((v - .63) / .11, 0., 1.));',
    '  vec2 gq = vec2(vU.x * 1.1, z * .55 + uT * .1), gi = floor(gq); float gh = h2(gi);',                                    // glints on the Sparkling River
    '  rv += vec3(.55) * step(.82, gh) * max(0., sin(uT * 3. + gh * 60.)) * RS(.3, .1, length(gq - gi - .5));',
    '  c = mix(c, rv, smoothstep(-e, e, v - top) * RS(e, -e, v - bot));',
    '  c = mix(c, mix(' + v3('#2f8468') + ', ' + v3('#17443c') + ', clamp((v - .74) / .26, 0., 1.)), smoothstep(-e, e, v - .748 - .006 * sin(u * 11.)));',
    '  vec2 lp = vec2((u - .5) / .52, (v - ' + (GY + .03) + ') / .03);',
    '  c = mix(c, vec3(.745, .922, .784), .16 * step(dot(lp, lp), 1.));',
    '  o = vec4(c * (1. + uK * .2 * RS(700., 90., z) * (n2(vU * .045) - .5)), 1.);', '}'].join('\n');
  // space and the planet from orbit: the same colours and curved bands as the game's voltaraBall, and it can be flown into
  var FS_PLANET = ['#version 300 es', 'precision highp float;', 'uniform vec2 uRes, uC;', 'uniform float uR, uT, uZ, uH;', 'in vec2 vU; in vec4 vC; out vec4 o;',
    'const vec3 BAND[8] = vec3[8](' + ['#ff8fb8', '#ffb37a', '#ffe58a', '#a8e6b0', '#8fc9ff', '#b9a3ff', '#ff8fb8', '#ffb37a'].map(v3).join(',') + ');',
    'const vec3 NP[7] = vec3[7](' + NEB.map(function (n) { return 'vec3(' + n[0] + ',' + (1 - n[1]).toFixed(2) + ',' + n[3] + ')'; }).join(',') + ');',
    'const vec3 NC[7] = vec3[7](' + NEB.map(function (n) { return v3(n[2]); }).join(',') + ');',
    'float h2(vec2 p){ p = fract(p * vec2(.1031, .1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.y); }',
    'float RS(float hi, float lo, float x){ return 1. - smoothstep(lo, hi, x); }',
    'float h3(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }',
    'float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);',
    '  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),',
    '             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }',
    'void main(){',
    '  vec2 fc = gl_FragCoord.xy, uv = fc / uRes; float m = min(uRes.x, uRes.y), M = max(uRes.x, uRes.y);',
    '  vec2 p = (fc - uC) / uR; float d = length(p), px = 1.5 / uR;',
    '  vec3 col = mix(vec3(5., 8., 20.), vec3(14., 9., 34.), (uv.x + 1. - uv.y) * .5) / 255.;',
    '  for (int i = 0; i < 7; i++) { float q = length((uv - NP[i].xy) * uRes) / (NP[i].z * M); col += NC[i] * (q < .5 ? mix(.34, .12, q * 2.) : mix(.12, 0., clamp(q * 2. - 1., 0., 1.))); }',
    '  vec2 sc = fc / (m * .04), si = floor(sc); float sh = h2(si);',
    '  if (sh > .78) { vec2 sp = si + .2 + .6 * vec2(h2(si + 7.3), h2(si + 3.1)); col += vec3(1., .94, .86) * (.35 + .5 * sin(uT * 1.5 + sh * 90.)) * RS(.1, .03, length(sc - sp)); }',
    '  col += vec3(1., .667, .882) * .6 * clamp(1. - (d - .92) / .48, 0., 1.) * step(.92, d);',
    '  for (int k = 0; k < 2; k++) { float md = k == 0 ? 1.45 : 1.75, an = uT * .15 + (k == 0 ? 0. : 2.6), mr = k == 0 ? .09 : .055;',
    '    vec2 mp = vec2(cos(an) * md, -sin(an) * md * .35), mq = p - mp; float ml = length(mq);',
    '    if (ml < mr + px && !(sin(an) < 0. && length(mp) < 1.)) { vec3 mc = k == 0 ? vec3(.91, .878, 1.) : vec3(1., .851, .769); mc = mix(mc, vec3(.03, .016, .157), .5 * step(0., dot(mq, vec2(.6, -.8)))); col = mix(col, mc, RS(mr + px, mr - px, ml)); } }',
    '  if (d < 1. + px) {',
    '    vec3 n = vec3(p, sqrt(max(0., 1. - d * d)));',
    '    vec3 q = vec3(n.x, n.y * .969 - n.z * .247, n.y * .247 + n.z * .969);',
    '    float lon = atan(q.x, q.z) + uT * .1, cl = sqrt(max(0., 1. - q.y * q.y));',
    '    float bx = p.x / 1.25, f = clamp(4. * (1. - p.y - .62 * (1. - sqrt(max(0., 1. - bx * bx))) + .012 * sin(uT * .3 + p.x * 2.)) - .25, 0., 7.999), fi = floor(f);',
    '    int i = int(fi);',
    '    vec3 pc = mix(BAND[i], BAND[min(i + 1, 7)], smoothstep(1. - 5. * px, 1., f - fi));',
    '    float dd = length(p - vec2(-.5, .38));',
    '    float sa = dd < 1.325 ? mix(0., .5, clamp((dd - .8) / .525, 0., 1.)) : mix(.5, .95, clamp((dd - 1.325) / .525, 0., 1.));',
    '    vec3 s = vec3(sin(lon) * cl, q.y, cos(lon) * cl);',
    '    float cn = n3(s * vec3(2.6, 7.5, 2.6) + 3.7) + .5 * n3(s * vec3(5.5, 15., 5.5) + 1.3);',
    '    float pink = step(.5, n3(s * 1.7 + 9.));',
    '    float cm = .8 * smoothstep(.98, 1.04, cn);',
    '    pc = mix(pc, mix(vec3(1.), vec3(1., .804, .91), pink), cm);',
    '    sa = mix(sa, min(.9, sa * 1.95), uZ);',                                                       // close up, the night is deeper
    '    pc = mix(pc, vec3(.039, .02, .188), sa);',
    '    if (uZ > 0.) {',                                                                              // down there in the night: glowing trees, the river, and the city with its lights going out
    '      vec2 cq = (p - vec2(' + CITYP[0] + ', ' + CITYP[1] + ')) / vec2(.13, .075), bg = (cq * .5 + .5) * vec2(9., 5.), bi = floor(bg), bf = fract(bg);',
    '      float dark = clamp(smoothstep(.25, .5, sa) * (1. - cm * 1.25), 0., 1.) * uZ, bh = h2(bi + 21.);',
    '      float inb = step(0., bi.x) * step(bi.x, 8.) * step(0., bi.y) * step(bi.y, 4.), rim = min(1., step(bi.x, .5) + step(7.5, bi.x) + step(bi.y, .5) + step(3.5, bi.y));',
    '      float edge = max(abs(bf.x - .5), abs(bf.y - .5)), blk = inb * step(.42 * rim, bh) * RS(.43, .39, edge), town = RS(1.12, 1.02, max(abs(cq.x), abs(cq.y)));',
    '      float ry = p.y - (' + CITYP[1] + ' - .125 + .012 * sin(p.x * 36.) + .02 * sin(p.x * 11.)), rw = RS(.016, .012, abs(ry));',
    '      vec2 g = p * 100., gi = floor(g); float gh = h2(gi), wood = n3(vec3(p * 11., 2.)), gr = .16 + .24 * h2(gi + 5.);',
    '      float tr = step(1.02 - .5 * wood, gh) * RS(gr, gr * .35, length(g - gi - .3 - .4 * vec2(h2(gi + 3.), h2(gi + 8.))));',
    '      pc += dark * (1. - town) * (1. - rw) * vec3(.0, .11, .08) * smoothstep(.45, .75, wood);',
    '      pc += dark * (1. - town) * (1. - rw) * vec3(.25, .95, .68) * tr * (.6 + .4 * sin(uT * 2. + gh * 50.));',
    '      vec2 rg = p * 300., ri = floor(rg); float rh = h2(ri);',
    '      pc = mix(pc, vec3(.16, .42, .78) + vec3(.9) * step(.84, rh) * max(0., sin(uT * 4. + rh * 40.)) * RS(.4, .15, length(rg - ri - .5)), dark * rw * .9);',
    '      pc = mix(pc, vec3(.045, .035, .14), dark * town * .8);',
    '      pc = mix(pc, ' + v3('#2a2560') + ', dark * blk);',
    '      pc = mix(pc, .75 * (bi.x < 3. ? ' + v3('#ff8f6b') + ' : bi.x < 6. ? ' + v3('#35d0c4') + ' : ' + v3('#f0c23b') + '), dark * blk * step(.78, bf.y));',     // Home Street, Market Street, Factory Row
    '      float off = 3.05 + 1.25 * bh, on = step(uT, off) * (uT > off - .5 ? step(.45, fract(uT * 9. + bh * 7.)) : 1.);',                                        // each block has its own moment to go dark
    '      vec2 wp = vec2((bf.x - .17) / .66 * 3., (bf.y - .16) / .56 * 2.), wq = abs(fract(wp) - .5);',
    '      float win = step(0., wp.x) * step(wp.x, 3.) * step(0., wp.y) * step(wp.y, 2.) * RS(.34, .26, max(wq.x, wq.y));',

    '    }',

    '    if (lh > .7 && la > .2 && la < 1.3 && d > .6 && d < .93) pc += (1. - uZ) * vec3(1., .88, .55) * (.5 + .4 * sin(uT * 2. + lh * 70.)) * RS(.2, .08, length(lg - li - .25 - .5 * vec2(h2(li + 5.), h2(li + 17.))));',
    '    float ra = mod(la + 6.2832, 6.2832);',
    '    if (ra > 2.5 && ra < 4.9) pc = mix(pc, vec3(1., .882, .961), .65 * smoothstep(.975, .99, d));',
    '    col = mix(col, pc, RS(1. + px, 1. - px, d));',

    '  o = vec4(mix(col, vec3(1., .86, .93), uH), 1.);', '}'].join('\n');

  /* ---------- set up once: the context, the programs, and every painted card in one texture ---------- */
  function prepare(cv, o) {

    var key = JSON.stringify([o.lit || 0, !!o.tower]);
    if (G && G.cv === cv && !G.lost && G.key === key) return G;

    try { gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' }); } catch (e) { gl = null; }

    g.V = new Float32Array(MAXQ * 36); g.vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, g.vb); gl.bufferData(gl.ARRAY_BUFFER, g.V.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 36, 12); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 36, 20);
    var ix = new Uint16Array(MAXQ * 6); for (var i = 0; i < MAXQ; i++) ix.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3], i * 6);

    g.SP._cv.width = g.SP._cv.height = 1; g.SP._cv = null;                                         // the painting canvas is not needed again
    gl.disable(gl.DEPTH_TEST); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.clearColor(.172, .165, .561, 1);

    G = g; return g;

  // Every card is painted once, with the game's own shapes and colours. Sizes here are in texture dots.
  function paint(o) {
    var ac = document.createElement('canvas'); ac.width = AW; ac.height = AH; var c = ac.getContext('2d'), SP = { _cv: ac }, X0 = 2, Y0 = 2, rowH = 0;
