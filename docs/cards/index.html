<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMQ cards: earn, read, collect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap">
<!--
  Galaxy Math Quest: the card a child earns, and the card book. From HANDOFF_Cards_2026-11-26.md (the cards thread).
  The game file is not touched. The piece the game would use is GMQCards, between the two marked lines below (GMQ CARDS: start / end).
  The rest of this page is a stand-in for the game: a picture, a desk, a few buttons that earn cards, and a save on this device only.
  Card faces and the card list are the battle thread's (docs/battle/cards.html, and docs/battle/cards.json when it lands).
  Checked by: checks/cards_sync_check.js (the faces and the list are the battle thread's own), checks/cards_pick_check.js (which card a child gets,
  on 20,000 made-up children), checks/cards_page_test.js (a child's play here, three screen sizes), checks/cards_in_game_test.js (the piece inside the real game).
  Address words for testing:  ?seed=123  a child's seed     ?fresh=1  start again     ?fast=1  no animation
                              ?old=6     an old save with 6 old cards (the game's names before the new set)     ?many=150  a book of 150 cards
                              ?rule=A|B|C  the doubles rule     ?arrive=one|pack  how the station's 15 cards arrive     ?oldway=keep|swap|map
-->
<style>
:root { --display: 'Chakra Petch', 'Trebuchet MS', 'Segoe UI', sans-serif; --body: 'Andika', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --ink: #e8eef8; --muted: #a9b9d0; --line: #33476a; --accent: #6db3ff; --accent-ink: #08121f; --good: #6fd08a; --bad: #ff9486; --gold: #ffb23e; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #04060e; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-text-size-adjust: 100%; }
/* the stand-in for the game: a picture and a desk, as the game sets them (beside the picture when the screen is wide, under it when it is tall) */
#stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; }
body.wide #stage { flex-direction: row; padding: 8px; }
#pic { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; background: #060912; border: 2px solid var(--line); border-radius: 16px; }
body.tall #pic { margin: 8px 8px 0; }
#scene { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(circle at 30% 30%, #142350, #060912 70%); }
#scene .place { position: absolute; left: 10px; top: 10px; font-family: var(--display); font-weight: 700; font-size: clamp(1.05rem, 3.4vw, 1.6rem); color: var(--gold); background: rgba(6,9,18,.8); padding: 5px 12px; border-radius: 10px; }
#scene .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #7f90ad; font-size: .95rem; padding: 0 16px; }
#scene svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#desk { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; }
body.wide #desk { width: clamp(340px, 31vw, 400px); margin-left: 14px; }
body.tall #desk { max-height: 46%; }
#toy { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; background: #0b1322; border: 2px solid var(--gold); border-radius: 16px; -webkit-overflow-scrolling: touch; }
body.tall #toy { margin: 8px; border-radius: 14px; }
#toy > * { flex: none; margin: 0 0 8px; }
#toy p, #toy h3 { margin-top: 0; }
.eyebrow { font-family: var(--display); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#toy h3 { font-family: var(--display); font-size: 1.05rem; color: var(--gold); margin: 0; }
.note { font-size: .95rem; color: #c4d0e2; line-height: 1.3; }
.field { display: flex; flex-wrap: wrap; align-items: center; margin: -3px; }
.field > * { margin: 3px; }
.btn { font-family: var(--display); font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 15px; font-size: 1rem; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.msg { min-height: 1.3em; font-weight: 700; }
details { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; }
details summary { cursor: pointer; font-weight: 700; color: var(--muted); }
details p { margin: 6px 0; }
label.opt { display: block; font-size: .92rem; margin: 3px 0; }
#foot { font-size: .75rem; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body class="tall">
<div id="stage">
  <div id="pic" aria-label="The picture">
    <div id="scene"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="sky"></svg><p class="place" id="place">KIS Station</p><p class="hint">This is a stand-in for the game's picture. Cards fill it.</p></div>
  </div>
  <div id="desk"><div id="toy" role="region" aria-live="polite"></div></div>
</div>

<script>
/* ===== GMQ CARDS: start =====
   Galaxy Math Quest: a card, when it is earned, and the card book. The cards thread, 26 November 2026 (HANDOFF_Cards_2026-11-26.md).
   [Source: Marc, 26 November: "when people do get cards and the space station that it shows what card they received like it pops up or something and they can
   actually read the card and see like what it does... It'd be cool if they can actually start collecting their own cards in their demo play through."]

   ONE PIECE, GMQCards. It draws in the picture area, on a layer of its own inside the element host.stage() gives, and puts only buttons and a few words on the desk
   (host.toy). [Source: CLAUDE.md, "The picture shows the task."] The card faces are the battle thread's own drawing: the DRAW block below is copied as it is from
   docs/battle/cards.html, and checks/cards_sync_check.js says when the two differ. The card list is the battle thread's too: GMQCards.use(list) takes the card data of
   docs/battle/cards.html, or docs/battle/cards.json when it lands. This piece never changes what a card does.
   No optional chaining and no nullish operator: older iPads cannot read them (the game's parse check fails on their two signs, even in a comment).

   GMQCards.use(list)                        the card list. Returns how many battle cards can be given.
   GMQCards.pick(seed, kind, owned, opt)     which card is given: an id. kind 'common', 'rare' or 'epic' (the game's 'gold' is read as epic). owned: the child's cards.
   GMQCards.rarity(x)                        x from 0 to 1: a kind, by the game's odds (70, 25, 5).
   GMQCards.record(id, why)                  a card to keep in the save: { id, r, n, why, unseen: 1 }. r is the game's word: 'gold' for epic.
   GMQCards.starterNext(seed, owned, left)   the card for a KIS Station task, with 'left' station tasks to go (this one included).
   GMQCards.starterPack(seed, owned)         the station's 15 cards at once (for the pack way of giving them).
   GMQCards.migrate(cards, way, seed)        old saved cards ({ r, n } with no id): way 'keep', 'swap' or 'map'. Returns { cards, changed }.
   GMQCards.show(host, card, why, done)      the card, earned. It fills the picture. One button on the desk: Add to my cards (and Read to me).
   GMQCards.showPack(host, cards, why, done) several cards, face down: tap each to turn it, then add them all.
   GMQCards.showLeave(host, card, why, done) a card that leaves the book (a challenge battle lost).
   GMQCards.book(host, cards, done, opt)     the card book.
   GMQCards.close(quiet), GMQCards.isOpen(), GMQCards.unseen(cards)
   host = { stage(): the picture's element, toy(html), closeToy(), save(), cards(): the child's cards,
            beep(freq, secs, type), speak(text), calm (no motion) }   (the last three may be left out)
   done(why) is called once: 'added', 'closed', 'ok' or 'gone' (the desk was taken by something else; the card stays unseen and can be shown again). */
var GMQCards = (function () {
'use strict';
var DATA = { kinds: [] };      /* the DRAW block reads DATA.kinds once; use() fills KIND again */
/* DRAW-BEGIN: the same block is in card_battle.html; checks/battle_cards_set_check.py compares them */
var NS='http://www.w3.org/2000/svg';
var TYPE={
 attack:{name:'ATTACK',c:'#ff8a3d',d:'#2a1a12',needs:'Needs your Weapons System'},
 defence:{name:'DEFENCE',c:'#4f9dff',d:'#111f3d',needs:'Needs your Shield Generator'},
 repair:{name:'REPAIR',c:'#ff4d6d',d:'#2b1320',needs:'Needs your Power Module'},
 spy:{name:'SPY',c:'#a78bfa',d:'#1d1838',needs:'Gets past the Main Shield'},
 guard:{name:'POLICE',c:'#5b8cff',d:'#101c40',needs:'Stops a Spy card'},
 dodge:{name:'DODGE',c:'#2dd4bf',d:'#0d2628',needs:'Needs your Shield Generator'},
 upgrade:{name:'UPGRADE',c:'#ffd23f',d:'#2a2210',needs:'Makes one part Level 2'}
};
var RAR={common:{name:'COMMON',c:'#7ed957',n:1},rare:{name:'RARE',c:'#b388ff',n:2},epic:{name:'EPIC',c:'#ffd23f',n:3}};
var KIND={};DATA.kinds.forEach(function(k){KIND[k.key]=k;});
var PARTCODE={'Engine Core':'engine','Navigation':'nav','Shield Generator':'gen','Weapons System':'weapons','Power Module':'power'};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rnd(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){s=s*16807%2147483647;return (s-1)/2147483646;};}
function hash(str){var h=7;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))%2147483647;}return h;}
function wrap(text,max){var words=text.split(' '),lines=[],cur='';for(var i=0;i<words.length;i++){var t=cur?cur+' '+words[i]:words[i];if(t.length>max&&cur){lines.push(cur);cur=words[i];}else{cur=t;}}if(cur)lines.push(cur);return lines;}
function stars(id,x,y,w,h,n){var r=rnd(hash(id)),o='';for(var i=0;i<n;i++){var cx=x+r()*w,cy=y+r()*h,rr=0.5+r()*1.3;o+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="#fff" opacity="'+(0.35+r()*0.6).toFixed(2)+'"/>';}return o;}

/* ---------- the symbols: one for each thing a card can do, as on Marc's 2023 cards. All drawn here; none is copied. ---------- */
function symGun(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'
 +'<path d="M-52,-20 L18,-20 Q30,-20 30,-8 L30,2 L-10,2 L-18,34 Q-20,42 -30,42 L-40,42 Q-48,42 -46,32 L-38,2 L-52,2 Q-60,2 -60,-9 Q-60,-20 -52,-20 Z" fill="#e9eefb" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<rect x="30" y="-15" width="26" height="12" rx="3" fill="#ff8a3d" stroke="#10162c" stroke-width="4"/>'
 +'<circle cx="62" cy="-9" r="7" fill="#ffd84a" stroke="#10162c" stroke-width="4"/>'
 +'<rect x="-44" y="-13" width="12" height="8" rx="2" fill="#ff8a3d"/><rect x="-26" y="-13" width="12" height="8" rx="2" fill="#ff8a3d"/><rect x="-8" y="-13" width="12" height="8" rx="2" fill="#ff8a3d"/>'
 +'<path d="M-22,2 Q-14,20 2,12 L4,2" fill="none" stroke="#10162c" stroke-width="4" stroke-linecap="round"/>'
 +'<path d="M76,-9 L98,-9 M74,-22 L90,-34 M74,4 L90,16" stroke="#ffd84a" stroke-width="5" stroke-linecap="round"/></g>';}
function symShield(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'
 +'<path d="M0,-58 L46,-42 L46,2 Q46,40 0,60 Q-46,40 -46,2 L-46,-42 Z" fill="#4f9dff" stroke="#10162c" stroke-width="5" stroke-linejoin="round"/>'
 +'<path d="M0,-58 L46,-42 L46,2 Q46,40 0,60 Z" fill="#2f6fd6"/>'
 +'<path d="M0,-58 L46,-42 L46,2 Q46,40 0,60 Q-46,40 -46,2 L-46,-42 Z" fill="none" stroke="#10162c" stroke-width="5" stroke-linejoin="round"/>'
 +'<path d="M0,-36 L26,-27 L26,0 Q26,22 0,36 Q-26,22 -26,0 L-26,-27 Z" fill="none" stroke="#e9eefb" stroke-width="5" stroke-linejoin="round"/></g>';}
function symHeart(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'
 +'<path d="M0,52 C-70,6 -62,-52 -26,-52 C-10,-52 -2,-42 0,-32 C2,-42 10,-52 26,-52 C62,-52 70,6 0,52 Z" fill="#ff4d6d" stroke="#10162c" stroke-width="5" stroke-linejoin="round"/>'
 +'<path d="M-34,-30 Q-40,-12 -28,0" fill="none" stroke="#ffd0d8" stroke-width="7" stroke-linecap="round"/>'
 +'<rect x="-6" y="-22" width="12" height="40" rx="3" fill="#fff"/><rect x="-20" y="-8" width="40" height="12" rx="3" fill="#fff"/></g>';}
function symPolice(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'
 +'<path d="M-70,58 Q-70,24 -38,18 L-10,18 Q20,24 20,58 Z" fill="#2f55c7" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<circle cx="-24" cy="-6" r="24" fill="#f1d3b3" stroke="#10162c" stroke-width="4"/>'
 +'<path d="M-52,-18 Q-24,-50 4,-18 L4,-12 L-52,-12 Z" fill="#2f55c7" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<rect x="-56" y="-14" width="66" height="8" rx="3" fill="#10162c"/>'
 +'<path d="M-24,-36 l4,7 l8,1 l-6,5 l2,8 l-8,-4 l-8,4 l2,-8 l-6,-5 l8,-1 Z" fill="#ffd84a"/>'
 +'<circle cx="-32" cy="-2" r="3" fill="#10162c"/><circle cx="-16" cy="-2" r="3" fill="#10162c"/><path d="M-32,9 Q-24,14 -16,9" fill="none" stroke="#10162c" stroke-width="3" stroke-linecap="round"/>'
 +'<path d="M-30,36 l6,6 l6,-6" fill="none" stroke="#ffd84a" stroke-width="4"/>'
 +'<path d="M30,-52 L56,-52 L74,-34 L74,-8 L56,10 L30,10 L12,-8 L12,-34 Z" fill="#e5484d" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>'
 +'<text x="43" y="-13" text-anchor="middle" font-size="21" font-weight="900" fill="#fff">STOP</text>'
 +'<rect x="38" y="10" width="10" height="46" fill="#cfd6e2" stroke="#10162c" stroke-width="3"/></g>';}
function symSpy(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')">'
 +'<path d="M-56,60 Q-56,22 -22,14 L22,14 Q56,22 56,60 Z" fill="#6b7089" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<path d="M-22,14 L0,44 L22,14 L30,34 L0,60 L-30,34 Z" fill="#4a4f6a" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<circle cx="0" cy="-8" r="26" fill="#f1d3b3" stroke="#10162c" stroke-width="4"/>'
 +'<path d="M-28,-26 L28,-26 L22,-58 Q0,-66 -22,-58 Z" fill="#2b2f45" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
 +'<rect x="-28" y="-34" width="56" height="9" fill="#8b5cf6"/>'
 +'<ellipse cx="0" cy="-24" rx="50" ry="9" fill="#2b2f45" stroke="#10162c" stroke-width="4"/>'
 +'<rect x="-24" y="-12" width="20" height="13" rx="5" fill="#10162c"/><rect x="4" y="-12" width="20" height="13" rx="5" fill="#10162c"/><rect x="-6" y="-9" width="12" height="4" fill="#10162c"/>'
 +'<path d="M-8,10 Q0,14 8,10" fill="none" stroke="#10162c" stroke-width="3" stroke-linecap="round"/></g>';}
/* dodge: a ship that has slipped aside. Two faint ships show where it was; the laser passes through the first of them. [Marc, 23 November: "Dodge should have its own picture"] */
function symDodge(x,y,s){
 function ship(tx,ty,op,ghost){
  var o='<g'+(ghost?' class="dg"':'')+' transform="translate('+tx+','+ty+') rotate(-32) scale('+(ghost?1.0:1.25)+')" opacity="'+op+'">';
  if(ghost)return o+'<path d="M-30,-9 L-48,-28 L-18,-16 Z M-30,9 L-48,28 L-18,16 Z M-36,0 Q-12,-28 40,0 Q-12,28 -36,0 Z" fill="#9ff3e6"/></g>';
  return o+'<path d="M-30,-9 L-48,-28 L-18,-16 Z M-30,9 L-48,28 L-18,16 Z" fill="#2dd4bf" stroke="#10162c" stroke-width="4" stroke-linejoin="round"/>'
   +'<path d="M-36,0 Q-12,-28 40,0 Q-12,28 -36,0 Z" fill="#e9eefb" stroke="#10162c" stroke-width="5" stroke-linejoin="round"/>'
   +'<circle cx="8" cy="0" r="9" fill="#4f9dff" stroke="#10162c" stroke-width="4"/></g>';}
 return '<g transform="translate('+x+','+y+') scale('+s+')">'
  +ship(-30,26,0.22,true)+ship(-8,6,0.42,true)
  +'<line x1="-74" y1="46" x2="72" y2="46" stroke="#ff8a3d" stroke-width="12" stroke-linecap="round"/><line x1="-74" y1="46" x2="72" y2="46" stroke="#fff3c4" stroke-width="4" stroke-linecap="round"/>'
  +ship(16,-20,1,false)+'</g>';}
function symUp(x,y,s){var o='<g transform="translate('+x+','+y+') scale('+s+')">';for(var i=0;i<3;i++){o+='<path d="M-44,'+(-12+i*30)+' L0,'+(-52+i*30)+' L44,'+(-12+i*30)+'" fill="none" stroke="#10162c" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-44,'+(-12+i*30)+' L0,'+(-52+i*30)+' L44,'+(-12+i*30)+'" fill="none" stroke="'+(i===0?'#ffd84a':(i===1?'#ffb347':'#ff8a3d'))+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>';}return o+'</g>';}
var SYMBOL={attack:symGun,defence:symShield,repair:symHeart,guard:symPolice,spy:symSpy,upgrade:symUp,dodge:symDodge};
function symbol(type,x,y,s){return SYMBOL[type](x,y,s);}
function partIcon(code,x,y,s,c){
 var g='<g transform="translate('+x+','+y+') scale('+s+')">';
 if(code==='engine'){g+='<circle r="26" fill="#141a30" stroke="'+c+'" stroke-width="4"/><circle r="15" fill="none" stroke="#dfe6f5" stroke-width="2" stroke-dasharray="6 5"/><circle r="8" fill="#ffb347"/><circle r="4" fill="#fff"/><path d="M-36,0 L-27,0 M27,0 L36,0 M0,-36 L0,-27 M0,27 L0,36" stroke="'+c+'" stroke-width="5" stroke-linecap="round"/>';}
 else if(code==='nav'){g+='<circle r="28" fill="#141a30" stroke="'+c+'" stroke-width="4"/><path d="M0,-22 L6,-4 L22,0 L6,4 L0,22 L-6,4 L-22,0 L-6,-4 Z" fill="#dfe6f5"/><path d="M0,-22 L6,-4 L0,0 Z" fill="'+c+'"/><circle r="3" fill="#141a30"/>';}
 else if(code==='gen'){g+='<path d="M-34,18 A34,34 0 0 1 34,18" fill="'+c+'" fill-opacity=".2" stroke="'+c+'" stroke-width="4"/><path d="M-20,18 A20,20 0 0 1 20,18" fill="none" stroke="#dfe6f5" stroke-width="2"/><rect x="-10" y="14" width="20" height="14" rx="2" fill="#dfe6f5"/><rect x="-38" y="26" width="76" height="6" rx="3" fill="'+c+'"/><circle cy="6" r="4" fill="#fff"/>';}
 else if(code==='weapons'){g+='<rect x="-30" y="12" width="44" height="14" rx="4" fill="#dfe6f5"/><circle cx="-8" cy="8" r="13" fill="#141a30" stroke="'+c+'" stroke-width="4"/><g transform="rotate(-28 -8 8)"><rect x="-6" y="3" width="46" height="10" rx="3" fill="'+c+'"/><rect x="34" y="1" width="8" height="14" rx="2" fill="#dfe6f5"/></g>';}
 else {g+='<rect x="-22" y="-24" width="44" height="52" rx="6" fill="#141a30" stroke="'+c+'" stroke-width="4"/><rect x="-9" y="-31" width="18" height="8" rx="2" fill="'+c+'"/><path d="M4,-16 L-9,4 L0,4 L-4,20 L10,-2 L1,-2 Z" fill="#ffd84a"/>';}
 return g+'</g>';
}

/* ---------- a whole card as SVG: a thick rim in the colour of its kind, one big symbol, one big number ---------- */
function gems(r,x,y){var o='';for(var i=0;i<r.n;i++){o+='<path d="M'+(x+i*17)+','+(y-8)+' l7,8 l-7,8 l-7,-8 Z" fill="'+r.c+'" stroke="#0b1020" stroke-width="1"/>';}return o;}
function nameSize(s){var n=s.length;return n<=12?21:(n<=15?18.5:(n<=18?16:(n<=21?14:12.5)));}
function frame(id,edge,body){
 var o='<defs><clipPath id="c'+id+'"><rect x="14" y="56" width="222" height="140" rx="6"/></clipPath></defs>';
 o+='<rect x="2" y="2" width="246" height="346" rx="18" fill="#0b1020"/>';
 o+='<rect x="4" y="4" width="242" height="342" rx="16" fill="'+edge+'"/>';
 o+='<rect x="15" y="15" width="220" height="320" rx="8" fill="'+body+'"/>';
 return o;
}
function cardSVG(card,uid){
 var look=card.sym||card.type,t=TYPE[look],r=RAR[card.rarity],id=uid||card.id.replace(/[^A-Za-z0-9]/g,'');
 var edge=r?r.c:'#dbe3f0',o='<svg xmlns="'+NS+'" viewBox="0 0 250 350" role="img" aria-label="'+esc(card.name+'. '+t.name.toLowerCase()+(card.rarity?', '+card.rarity:'')+'. '+card.text)+'">';
 o+=frame(id,edge,'#141b33');
 o+='<rect x="15" y="15" width="220" height="38" rx="8" fill="'+edge+'"/><rect x="15" y="40" width="220" height="13" fill="'+edge+'"/>';
 o+='<text x="125" y="'+(34+nameSize(card.name)*0.34)+'" text-anchor="middle" font-size="'+nameSize(card.name)+'" font-weight="900" fill="#10162c" class="nm">'+esc(card.name)+'</text>';
 o+='<rect x="15" y="53" width="220" height="146" fill="'+t.d+'"/><circle cx="108" cy="126" r="66" fill="'+t.c+'" opacity=".22"/>';
