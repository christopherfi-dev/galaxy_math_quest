<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galactic Trade: the market</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap">
<!--
  Galaxy Math Quest: Galactic Trade, rebuilt as the galaxy's market. Its own page, from proposals/GMQ_Trade_Rethought_v1_2026-11-23.md (option A)
  and HANDOFF_Trade_2026-11-23.md. The game file is not touched. The piece the game would use is GMQTrade, between the two marked lines below.
  The rest of this page is a stand-in for the game: a canvas, a desk, a number pad, and a save on this device only.
  Checked by checks/trade_market_check.js (the number rule, 20,000 seeds) and checks/trade_market_test.js (a child's play, three screen sizes).
  Address words for testing:  ?seed=123  a child's seed        ?fresh=1  start again        ?stone=1  the child already has a glow stone (the tall tree)
                              ?fast=1    the ship flies fast    ?last=2000  an old version 97 season of 2,000 gems, kept in the log
-->
<style>
:root { --display: 'Chakra Petch', 'Trebuchet MS', 'Segoe UI', sans-serif; --body: 'Andika', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --ink: #e8eef8; --muted: #a9b9d0; --line: #33476a; --accent: #6db3ff; --accent-ink: #08121f; --good: #6fd08a; --bad: #ff9486; --gold: #ffb23e; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #04060e; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-text-size-adjust: 100%; }
#stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
body.wide #stage { flex-direction: row; }
#pic { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; background: #04060e; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#desk { flex: 0 0 auto; display: flex; flex-direction: column; background: #0b1322; min-height: 0; }
body.wide #desk { width: clamp(300px, 32vw, 400px); border-left: 2px solid var(--gold); }
body.tall #desk { height: 46%; border-top: 2px solid var(--gold); }
#toy { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; -webkit-overflow-scrolling: touch; }
#toy p, #toy h3 { margin: 0; }
.eyebrow { font-family: var(--display); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#toy h3 { font-family: var(--display); font-size: 1.05rem; color: var(--gold); }
.story { font-size: 1.08rem; line-height: 1.35; }
.q { font-weight: 700; font-size: 1.08rem; line-height: 1.3; }
.note { font-size: .9rem; color: var(--muted); line-height: 1.3; }
.mw { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 8px; }
.field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field label { display: flex; flex-direction: column; gap: 2px; font-size: .85rem; color: var(--muted); }
.field input { width: 5.6em; font: inherit; font-size: 1.3rem; font-weight: 700; text-align: center; padding: 6px; border: 2px solid var(--ink); border-radius: 10px; background: #04060e; color: var(--ink); font-variant-numeric: tabular-nums; }
.field input:focus { outline: 3px solid var(--gold); outline-offset: 1px; }
.btn { font-family: var(--display); font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 14px; font-size: 1rem; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:disabled { opacity: .45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { min-width: 3.4em; padding: 7px 10px; }
.chips .btn.on { background: var(--gold); color: #2b1a00; border-color: var(--gold); }
.msg { min-height: 1.3em; font-weight: 700; }
.msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
.buy { display: flex; flex-direction: column; gap: 4px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.buy b { font-family: var(--display); }
table.log { border-collapse: collapse; font-size: .9rem; } table.log th, table.log td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; } table.log th { color: var(--muted); font-weight: 400; }
#foot { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 14px 6px; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); }
#foot button { font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
/* the stand-in number pad: on an iPad the keyboard would cover the picture (the game has its own pad; see the wiring note) */
#pad { flex: 0 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 6px 14px 8px; border-top: 1px solid var(--line); }
#pad button { font-family: var(--display); font-weight: 700; font-size: 1.15rem; height: 42px; border-radius: 9px; border: 1.5px solid var(--line); background: #132035; color: var(--ink); }
#pad button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
body.tall #pad button { height: 38px; }
@media (max-width: 560px) { body.tall #desk { height: 51%; } #foot { padding: 2px 12px 4px; font-size: .7rem; } }
@media (max-width: 560px), (max-height: 560px) { #toy { padding: 8px 12px; gap: 5px; } .story { font-size: 1rem; } .q { font-size: 1rem; } .note { font-size: .84rem; } .btn { padding: 7px 11px; font-size: .95rem; } .field input { font-size: 1.15rem; width: 5em; } #pad button { height: 36px; } }
</style>
</head>
<body class="tall">
<div id="stage">
  <div id="pic"><canvas id="cv" aria-label="The trade board and the star map. Tap a planet to load a crate for it."></canvas></div>
  <section id="desk" aria-label="Galactic Trade">
    <div id="toy" role="region" aria-live="polite"></div>
    <div id="pad" hidden role="group" aria-label="Number pad"></div>
    <div id="foot"><span id="said"></span><span><button type="button" id="again">Start again</button></span></div>
  </section>
</div>

<script>
/* ===== GMQ TRADE: start =====
   Galactic Trade, rebuilt as the galaxy's market. One entry point:  GMQTrade.open(host, state, done)
     host   the game's own functions, which the piece calls:
              say(text)  beep(freq, secs, type)  card()  give(item)  has(item)  save()  toy(html)  closeToy()
              and, read each frame: cx (the picture's 2D context), vw, vh (its size in CSS pixels), tNow (seconds). Give them as getters.
     state  one plain object the game keeps for the child (S.market). Start it as {} or { seed: S.seed }; the piece fills it in and calls host.save().
            Optional: state.lastSeason = the gems of an old version 97 season; the ship's log shows it.
     done   called once, when the child leaves: done('leave') or done('finished').
   While it is open, the game calls GMQTrade.frame(dt) on every frame (in place of drawTrade) and GMQTrade.tap(x, y) on a tap on the picture
   (x, y in CSS pixels, in place of tradeTap). GMQTrade.isOpen() says whether it is open.
   GMQTrade.visited(state) lists the planets the child has sold to (and R, once flown to): the game may let these be landed on.
   Items it gives: 'stone' (the glow stone; the game's lantern chain uses it). It reads has('stone') and has('lantern').
   It uses no optional chaining and no nullish operator (older iPads cannot read them).
   Everything is [Proposal] unless it says [Source]. Choices made without Marc are marked [pick]. */
var GMQTrade = (function () {
  'use strict';
  /* ---------- THE NUMBER RULE (checked on 20,000 seeds by checks/trade_market_check.js, which reads this block) ---------- */
  var RULE = (function () {
    'use strict';
    /* [Source] Marc's Trade Data Sheet: the letters and distances (the game's TR). [Proposal] a planet's light-years are its distance to the nearest ten,
       so fuel is 2 x a ten (3.NBT.3), and the planet is drawn on that ring. */
    var DIST = { A: 12, B: 26, C: 33, D: 18, E: 44, F: 5, G: 22, H: 25, I: 45, J: 17, K: 37, L: 53, M: 28, N: 66, O: 52, P: 71, Q: 48, R: 59, S: 41, T: 64 };
    var ORDER = ['F', 'S', 'J', 'I', 'G', 'O', 'B', 'R', 'C', 'N', 'P', 'K', 'T', 'M', 'L', 'H', 'Q', 'D', 'E', 'A'];
    var LY = {}; Object.keys(DIST).forEach(function (n) { LY[n] = Math.floor((DIST[n] + 5) / 10) * 10; });
    var K = { gift: 100, crates: 3, perLy: 2, full: 600, low: 60, stone: 'R', stonePrice: 300, supplies: 500, offers: 5, margin: 20, tries: 8000 };
    var WANTS = ['fruit', 'glass', 'rope', 'lamps', 'seeds', 'cloth', 'bells', 'paint'];
    function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function hash(a, b, c) { var h = Math.imul((a >>> 0) ^ 0x9E3779B9, 0x85EBCA6B); h = Math.imul(h ^ (b + 0x27D4EB2F), 0xC2B2AE35); h = Math.imul(h ^ (c + 0x165667B1), 0x27D4EB2F); return (h ^ h >>> 16) >>> 0; }
    function fuelOf(n) { return K.perLy * LY[n]; }
    /* every choice a child can make on a board: one, two or three offers */
    function choices(offers, B) { var out = [], m = offers.length;
      for (var mask = 1; mask < (1 << m); mask++) { var pick = [], fuel = 0, pay = 0;
        for (var i = 0; i < m; i++) if (mask & (1 << i)) { pick.push(i); fuel += fuelOf(offers[i].n); pay += offers[i].pay; }
        if (pick.length <= K.crates) out.push({ pick: pick, fuel: fuel, pay: pay, fits: fuel <= B, left: B - fuel, end: B - fuel + pay }); }
      return out; }
    function byPay(offers) { return offers.map(function (o, i) { return i; }).sort(function (a, b) { return offers[b].pay - offers[a].pay; }); }
    /* a child who takes the biggest pay first, while the fuel fits */
    function greedy(offers, B, order) { var pick = [], fuel = 0, pay = 0;
      order.forEach(function (i) { var f = fuelOf(offers[i].n); if (pick.length < K.crates && fuel + f <= B) { pick.push(i); fuel += f; pay += offers[i].pay; } });
      return { pick: pick.sort(), fuel: fuel, pay: pay, end: B - fuel + pay }; }
    function judge(offers, B) { var all = choices(offers, B).filter(function (c) { return c.fits; }).sort(function (a, b) { return b.end - a.end; });
      var big = byPay(offers)[0];
      return { all: all, best: all[0], second: all[1], margin: all[1] ? all[0].end - all[1].end : 999, big: big, bigInBest: all[0].pick.indexOf(big) >= 0,
        payGreedy: greedy(offers, B, byPay(offers)),
      nearGreedy: greedy(offers, B, offers.map(function (o, i) { return i; }).sort(function (a, b) { return LY[offers[a].n] - LY[offers[b].n] || offers[b].pay - offers[a].pay; })),
        netGreedy: greedy(offers, B, offers.map(function (o, i) { return i; }).sort(function (a, b) { return (offers[b].pay - fuelOf(offers[b].n)) - (offers[a].pay - fuelOf(offers[a].n)); })) }; }
    /* the net (pay minus fuel) a planet tends to give, by its distance: [lowest, highest] */
    var NET1 = { 10: [70, 170], 20: [60, 180], 30: [50, 190], 40: [50, 200], 50: [60, 210] };
    var NET2 = { 10: [30, 115], 20: [25, 120], 30: [15, 125], 40: [10, 130], 50: [-10, 130], 60: [-30, 120], 70: [-40, 110] };
    function draw(r, first, near, decoy) { var ri = function (a, b) { return a + Math.floor(r() * (b - a + 1)); };
      var pool = ORDER.filter(function (n) { return n !== K.stone && (!first || LY[n] <= 50); }), at = function (n) { return ORDER.indexOf(n); }, got = [];
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      /* spread on the map: no two offers side by side in the fan, and none beside the stone's planet */
      pool.forEach(function (n) { if (got.length < K.offers && Math.abs(at(n) - at(K.stone)) >= 2 && got.every(function (g) { return Math.abs(at(g) - at(n)) >= 2; })) got.push(n); });
      if (got.length < K.offers) return null;
      got.sort(function (a, b) { return at(a) - at(b); });      /* left to right, as they sit in the fan: the cards above the map are in the same order */
      if (!first && (!got.some(function (n) { return LY[n] >= 60; }) || !got.some(function (n) { return LY[n] <= 20; }))) return null;
      var w = WANTS.slice(); for (i = w.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); t = w[i]; w[i] = w[j]; w[j] = t; }
      var lossAt = -1; if (!first) { var far = got.map(function (n, k) { return LY[n] >= 50 ? k : -1; }).filter(function (k) { return k >= 0; }); lossAt = far[Math.floor(r() * far.length)]; }
      /* the nearest-planets decoy: one of the nearest planets wants little, so it pays only a little more than its fuel */
    var nearAt = -1; if (near) { var lo = Math.min.apply(null, got.map(function (n) { return LY[n]; })), nk = got.map(function (n, k) { return LY[n] === lo ? k : -1; }).filter(function (k) { return k >= 0; }); nearAt = nk[Math.floor(r() * nk.length)]; }
    var out = got.map(function (n, k) { var R = (first ? NET1 : NET2)[LY[n]], net = k === lossAt ? -ri(15, 45) : k === nearAt ? ri(Math.max(5, 41 - fuelOf(n)), 40) : ri(R[0], R[1]), pay = fuelOf(n) + net;
      if (pay % 10 === 0) pay += (k === lossAt ? -1 : 1) * ri(1, 3);
      return { n: n, pay: pay, want: w[k] }; });
    /* the biggest-pay decoy, on later trips: a far planet pays the most, but leaves little after its fuel */
    if (decoy && !first) { var bigs = out.map(function (o, k) { return LY[o.n] >= 50 && k !== lossAt && k !== nearAt ? k : -1; }).filter(function (k) { return k >= 0; });
      if (bigs.length) { var bk = bigs[Math.floor(r() * bigs.length)], top = Math.max.apply(null, out.map(function (o, k) { return k === bk ? 0 : o.pay; })), bp = top + ri(5, 50); if (bp % 10 === 0) bp += 3; if (bp <= 399) out[bk].pay = bp; } }
    /* and on the other boards, a planet that pays the most and is worth it: not far, so its fuel is small */
    if (!decoy && !first) { var good = out.map(function (o, k) { return LY[o.n] <= 40 && k !== lossAt && k !== nearAt ? k : -1; }).filter(function (k) { return k >= 0; });
      if (good.length) { var gk = good[Math.floor(r() * good.length)], top2 = Math.max.apply(null, out.map(function (o, k) { return k === gk ? 0 : o.pay; })), gp = top2 + ri(5, 30); if (gp % 10 === 0) gp += 3; if (gp <= 399 && gp - fuelOf(out[gk].n) <= 170) out[gk].pay = gp; } }
    return out; }
    function fine(offers, j, B, first, decoy, near) {
      if (!j.best || j.all.length < 4) return false;
      if (offers.some(function (o) { return o.pay < 40 || o.pay > 399 || o.pay % 10 === 0; })) return false;
      if (offers.filter(function (o) { return fuelOf(o.n) <= B; }).length < 2) return false;
      var pays = offers.map(function (o) { return o.pay; }).sort(function (a, b) { return b - a; }); if (pays[0] === pays[1]) return false;
      if (j.margin < K.margin) return false;
      if (j.all.some(function (c) { return c.end > 999 || c.pay > 999; })) return false;
      var net = j.best.end - B;
      if (first) { if (j.best.end < 300 || j.best.end > 390 || j.best.pick.length < 2) return false; }
      else { if (net < 160 || net > 280) return false; if (!offers.some(function (o) { return o.pay < fuelOf(o.n); })) return false; }
      if (decoy === j.bigInBest) return false;
      if (decoy && j.payGreedy.end > j.best.end - 40) return false;
    if (near && j.nearGreedy.end > j.best.end - 30) return false;
      return true; }
    /* one board for one trip: from the child's seed, the trip number and the gems they fly with.
       The biggest pay is a decoy (not part of the best choice) on 7 first boards in 10 and on 6 later boards in 10. On the rest it is part of it,
     so "never take the biggest" is not a rule either. The nearest planets are a decoy (a child who only saves fuel comes home 30 gems or more behind)
     on half the first boards and on 3 later boards in 10. No one shortcut works. A later board teaches one of the two at a time: once the hold, not
     the fuel, is the limit, a planet that pays the most and also leaves the least is too rare to ask for alongside a poor near planet.
       If no board is found in 5,000 draws, the decoy is turned the other way, and after 6,500 the nearest-planets decoy is dropped (the check counts how often: it must be never). */
    function board(seed, trip, B) { var r = rng(hash(seed, trip, B)), first = trip === 1, u = r(), decoy = first ? u < 0.7 : u < 0.6, near = first ? r() < 0.5 : u >= 0.6 && u < 0.9;
      for (var tries = 1; tries <= K.tries; tries++) { var d = tries > 5000 ? !decoy : decoy, nr = tries > 6500 ? false : near, offers = draw(r, first, nr, d); if (!offers) continue; var j = judge(offers, B);
      /* a near miss: the best plan leads by less than 20 gems. Raise the pay of one planet in the best plan and not in the next, then judge the board again. */
      if (j.second && j.margin < K.margin) { var sp = j.second.pick, kk = j.best.pick.filter(function (k) { return sp.indexOf(k) < 0; })[0];
        if (kk !== undefined) { var np = offers[kk].pay + K.margin - j.margin + Math.floor(r() * 13); if (np % 10 === 0) np++; if (np <= 399) { offers[kk].pay = np; j = judge(offers, B); } } }
        if (fine(offers, j, B, first, d, nr)) return { offers: offers, tries: tries, judge: j, decoy: d, near: nr, eased: tries > 5000 }; }
      return null; }
    /* what the page calls: the child's own board, or, in the rare case that none is found, the board of a nearby seed (the check counts how often) */
  function boardFor(seed, trip, B) { for (var k = 0; k < 6; k++) { var b = board(seed + k * 7919, trip, B); if (b) { b.other = k; return b; } } return null; }
  return { K: K, LY: LY, DIST: DIST, ORDER: ORDER, WANTS: WANTS, fuelOf: fuelOf, choices: choices, judge: judge, board: board, boardFor: boardFor, rng: rng, hash: hash };
  })();
  var K = RULE.K, LY = RULE.LY, ORDER = RULE.ORDER;
  /* [Source] the game's planet colours (TR_COL), by a planet's place in Marc's list A to T */
  var COL = ['#ff9ec4', '#9fd3ff', '#ffe58a', '#a8e6b0', '#b9a3ff', '#ffb37a', '#8fe0d8', '#f4a0a0', '#c9e2ff', '#d8c4ff'], LETTERS = 'ABCDEFGHIJKLMNOPQRST';
  var INK = '#0e1626';
  var H = null, S = null, DONE = null, W = { fly: null, pops: [], hint: 0 }, OPEN = false;

  /* ---------- small helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function num(n) { return Number(n).toLocaleString('en'); }
  function beep(f, d, t) { try { if (H.beep) H.beep(f, d, t); } catch (e) {} }
  function save() { try { if (H.save) H.save(); } catch (e) {} }
  function has(it) { try { return !!(H.has && H.has(it)); } catch (e) { return false; } }
  function hasStone() { return has('stone') || has('lantern'); }
  function list(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function planets(ns) { return (ns.length > 1 ? 'Planets ' : 'Planet ') + list(ns); }
  function offers() { return S.board ? S.board.offers : []; }
  function chosen() { var o = offers(); return S.sel.map(function (i) { return o[i]; }); }
  function fuelFor(os) { return os.reduce(function (a, o) { return a + RULE.fuelOf(o.n); }, 0); }
  function numBox(id, label) { return '<label for="' + id + '">' + label + '<input id="' + id + '" inputmode="numeric" autocomplete="off" maxlength="4"></label>'; }
  function val(id) { var e = $(id); return e && e.value !== '' ? +e.value : null; }
  function msg(text, good) { var m = $('msg'); if (m) { m.className = 'msg ' + (good ? 'good' : 'bad'); m.textContent = text; try { m.scrollIntoView({ block: 'nearest' }); } catch (e) {} } }      /* on a phone the message can sit under the number pad: bring it into view */
  function onlyDigits() { Array.prototype.forEach.call(document.querySelectorAll('#toy input'), function (i) { i.oninput = function () { i.value = i.value.replace(/[^0-9]/g, '').slice(0, 4); };
    i.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); var t = $('try'); if (t) t.click(); } }; }); var f = document.querySelector('#toy input'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {} }
  function on(id, fn) { var e = $(id); if (e) e.onclick = fn; }
  function toy(html) { H.toy(html); }
  function eyebrow(t) { return '<p class="eyebrow">Galactic Trade · ' + t + '</p>'; }
  function logAdd(e) { S.log.push(e); }

  /* ---------- opening, and where the child is ---------- */
  function open(host, state, done) { H = host; S = state; DONE = done; OPEN = true; W = { fly: null, pops: [], hint: 0 };
    if (!S.v) { var seed = S.seed >>> 0 || (Math.floor(Math.random() * 1e9) + 1); for (var k in S) if (S.hasOwnProperty(k) && k !== 'lastSeason') delete S[k];
      S.v = 1; S.seed = seed; S.step = 'call'; S.gems = 0; S.trip = 1; S.board = null; S.sel = []; S.left = 0; S.log = []; S.bought = { supplies: false, stone: false }; S.gifts = 0; save(); }
    show(); }
  function show() { var s = S.step;
    if (s === 'call') return call(); if (s === 'hold') return hold(); if (s === 'list') return priceList(); if (s === 'rules') return rules(); if (s === 'demo') return demo();
    if (s === 'pump') return pump(); if (s === 'fly') return fly(); if (s === 'count') return count(); if (s === 'result') return result();
    if (s === 'spump') return stonePump(); if (s === 'sfly') return stoneFly(); if (s === 'spay') return stonePay(); if (s === 'shome') return stoneHome(); if (s === 'done') return finished();
    return plan(); }
  function go(step) { S.step = step; save(); show(); }
  function leave() { OPEN = false; W.fly = null; try { if (H.closeToy) H.closeToy(); } catch (e) {} save(); var d = DONE; DONE = null; if (d) d(S.step === 'done' ? 'finished' : 'leave'); }

  /* ---------- THE STORY, told first. [Source: Marc's Task 2 page: "they have sent out a galaxy-wide SOS! They're low on essential supplies"]
     A sentence or two at a time (his rule 7). The goal is shown at once, as a price list, so every trip has a reason. ---------- */
  function call() { W.look = 'voltara';

  function priceList() { W.look = 'stone';

  function rules() { W.look = 'rings';
    toy(eyebrow('how trading works') + '<h3>Fuel</h3><p class="story">Fuel costs 2 gems for each light-year. The rings on the map show the light-years.</p><p class="story">You pay for fuel to fly out. The trade beacon pulls you home for free.</p>' +
      '<p class="mw">Get some paper and a pencil. Traders write their sums down.</p>' +
      '<div class="field"><button class="btn" type="button" id="try">Show me</button><button class="btn quiet" type="button" id="trback">Back</button></div>');
    on('try', function () { go('demo'); }); on('trback', function () { go('list'); }); }

  /* ---------- SEE IT FIRST (his rule 3): one solved choice about something else. Coins and rent at a fruit market, not gems and fuel.
     Recomputed in checks/trade_market_check.js: every choice of one or two stalls. P alone ends with 52; Q and R end with 63, the most; Q and S, and R and S, cost too much rent. ---------- */
  var DEMO = { coins: 10, baskets: 2, stalls: [['P', 52, 10], ['Q', 35, 6], ['R', 28, 4], ['S', 30, 7]], lines: [
    'I have 10 coins for rent. My cart holds 2 baskets.',

    'R and S: rent 4 + 7 = 11. Too much!',
    '63 is more than 52. I take Q and R.'] };
  function demo() { W.look = 'demo';
    toy('<p class="eyebrow">See it first</p><h3>Tavi sells fruit</h3><p class="story">Tavi sells fruit at Voltara\'s market. Her cart holds 2 baskets. She has 10 coins to pay rent for the stalls.</p>' +
      '<p class="story">Look at her paper. Stall P pays the most. But Q and R together leave her more.</p>' +

  /* ---------- A TRIP: choose, buy fuel, fly, count ---------- */
  /* [pick] a chest holds 999 gems; with 600 or more, a good trip could fill it, so the child buys first. Every number stays within 1,000.
     [pick] below 60 gems the Council sends 100 more for fuel, as a gift, so no child is left unable to fly. */
  function canBuyAll() { return S.bought.supplies && (S.bought.stone || hasStone()); }
  function newBoard() { var B = S.gems, note = '';
    if (B < K.low) { S.gems = B = B + K.gift; S.gifts++; logAdd({ kind: 'gift', gems: S.gems }); note = 'The Council sees your chest is nearly empty. It sends 100 gems for fuel, as a gift.'; }
    var b = RULE.boardFor(S.seed, S.trip, B);

    var chips = o.map(function (x, i) { var onn = S.sel.indexOf(i) >= 0; return '<button class="btn quiet' + (onn ? ' on' : '') + '" type="button" data-i="' + i + '" aria-pressed="' + onn + '">' + x.n + ' · ' + x.want + '</button>'; }).join('');
    toy(eyebrow('trip ' + S.trip) + '<h3>Choose your planets</h3>' + (note ? '<p class="note">' + note + '</p>' : '') +

      '<div class="field"><button class="btn" type="button" id="try">Fly</button><button class="btn quiet" type="button" id="trhint">A hint</button><button class="btn quiet" type="button" id="trbuy">To buy</button><button class="btn quiet" type="button" id="trlog">Ship\'s log</button><button class="btn quiet" type="button" id="trleave">Leave</button></div>');
    Array.prototype.forEach.call(document.querySelectorAll('#toy .chips .btn'), function (b) { b.onclick = function () { toggle(+b.dataset.i); }; });
    on('try', function () { if (!S.sel.length) { beep(140, .2, 'square'); return msg('Load a crate for one planet first.'); } go('pump'); });

  /* nudges only when asked, and never a number (his rule of 19 November) */
  var HINTS = ['Write each plan on your paper. Work out its fuel. Then work out the gems you would come home with.',
    'The planet that pays the most may cost the most fuel. Check it.', 'Compare the gems each plan brings home. The most is the best plan.',

  function toggle(i) { if (S.step !== 'plan' || !S.board) return; var o = offers()[i]; if (!o) return; var k = S.sel.indexOf(i);
    if (k >= 0) S.sel.splice(k, 1); else { if (S.sel.length >= K.crates) { beep(140, .2, 'square'); return msgNow('Your hold has only 3 crates. Take one off first.'); } S.sel.push(i); }
    S.sel.sort(); beep(k >= 0 ? 300 : 520, .05); save(); plan(k >= 0 ? 'The crate for Planet ' + o.n + ' is off.' : 'A crate for Planet ' + o.n + ' is loaded.'); }
  function msgNow(t) { msg(t, false); }
  function full() { W.look = 'board';

      '<div class="field"><button class="btn" type="button" id="trbuy">To buy</button><button class="btn quiet" type="button" id="trlog">Ship\'s log</button><button class="btn quiet" type="button" id="trleave">Leave</button></div>');
    on('trbuy', buyList); on('trlog', shipLog); on('trleave', leave); }

  /* the fuel: the child works it out, and what is left. [Source: Marc, 21 November: "Never show the adding for the child."] */
  function pump() { W.look = 'board'; var os = chosen(), fuel = fuelFor(os); W.tries = 0;
    toy(eyebrow('trip ' + S.trip + ' · fuel') + '<h3>Buy your fuel</h3><p class="q">Your crates go to ' + planets(os.map(function (o) { return o.n; })) + '. You have ' + num(S.gems) + ' gems.</p>' +

      '<div class="field">' + numBox('ans', 'Fuel, in gems') + numBox('ans2', 'Gems left after fuel') + '</div>' +
      '<div class="field"><button class="btn" type="button" id="try">Check</button><button class="btn quiet" type="button" id="trback">Change my plan</button></div><div class="msg" id="msg" role="status"></div>');
    onlyDigits(); on('trback', function () { go('plan'); });
    on('try', function () { var a = val('ans'), b = val('ans2'); if (a === null) return msg('Type the fuel first.'); W.tries++;
      if (a !== fuel) { beep(140, .2, 'square'); return msg(os.length > 1 ? 'Not yet. Find the light-years to each planet. Each light-year costs 2 gems.' : 'Not yet. Find the light-years to the planet. Each light-year costs 2 gems.'); }
      if (fuel > S.gems) { beep(140, .2, 'square'); logAdd({ kind: 'short', trip: S.trip, route: os.map(function (o) { return o.n; }), fuel: fuel, gems: S.gems }); save();

      if (b === null) return msg('Right. Now type the gems left after fuel.', true);

      beep(880, .1); $('try').outerHTML = '<button class="btn" type="button" id="trfly">Pay and fly</button>'; msg('Right. Fuel: ' + num(fuel) + ' gems. You will have ' + num(b) + ' left.', true);
      on('trfly', function () { S.left = S.gems - fuel; S.paid = fuel; S.gems = S.left; go('fly'); }); }); }
  function fly() { W.look = 'fly'; startFly(chosen().map(function (o) { return o.n; }), false);
    toy(eyebrow('trip ' + S.trip) + '<h3>On your way</h3><p class="q">Your ship flies to ' + planets(chosen().map(function (o) { return o.n; })) + ', one at a time.</p><p class="note">After each planet, the beacon pulls the ship home. Watch the map.</p>'); }
  function count() { W.look = 'board'; var os = chosen(), end = S.left + os.reduce(function (a, o) { return a + o.pay; }, 0); W.tries = 0;
    toy(eyebrow('trip ' + S.trip) + '<h3>Count your gems</h3><p class="q">After fuel you had ' + num(S.left) + ' gems. ' + os.map(function (o) { return 'Planet ' + o.n + ' paid ' + num(o.pay) + '.'; }).join(' ') + '</p>' +
      '<p class="story">How many gems do you have now?</p><div class="field">' + numBox('ans', 'Gems now') + '<button class="btn" type="button" id="try">Check</button></div><div class="msg" id="msg" role="status"></div>');
    onlyDigits();
    on('try', function () { var a = val('ans'); if (a === null) return msg('Type a number first.'); W.tries++;
      if (a !== end) { beep(140, .2, 'square'); return msg(W.tries < 2 ? 'Not yet. Start with the gems you had after fuel. Add what each planet paid.' : 'Not yet. Add the hundreds, then the tens, then the ones. Check each one on your paper.'); }
      beep(880, .1); var lost = os.filter(function (o) { return o.pay < RULE.fuelOf(o.n); }).map(function (o) { return o.n; });
      logAdd({ kind: 'trade', trip: S.trip, route: os.map(function (o) { return [o.n, o.pay]; }), fuel: S.paid, start: S.board.B, gems: end, lost: lost, tries: W.tries });
      S.gems = end; S.last = { start: S.board.B, lost: lost, route: os.map(function (o) { return o.n; }), offers: S.board.offers, sel: S.sel.slice() }; S.trip++; S.board = null; S.sel = []; go('result'); }); }
  function result() { W.look = 'map'; var L = S.last || { start: 0, lost: [] }, e = S.log.filter(function (x) { return x.kind === 'trade'; }).pop() || { route: [] };
    var lossLine = e.route.filter(function (r) { return r[1] < RULE.fuelOf(r[0]); }).map(function (r) { return 'Planet ' + r[0] + ' paid ' + num(r[1]) + ', but its fuel cost ' + num(RULE.fuelOf(r[0])) + '. That planet lost you ' + num(RULE.fuelOf(r[0]) - r[1]) + ' gems.'; }).join(' ');
    toy(eyebrow('trip ' + e.trip + ' is done') + '<h3>Home again</h3><p class="q">You set off with ' + num(L.start) + ' gems. You came home with ' + num(S.gems) + '.</p>' +

  /* ---------- THE FLIGHT: out to each planet under its own fuel; home on the beacon's pull, with no flame (as in the game's drawTrade) ---------- */
  function startFly(ns, stone, home) { W.fly = { ns: ns, stone: stone, home: !!home, t: 0, seg: 0, paidAt: {} }; W.pops = []; }

  /* ---------- THE PICTURE ---------- */

  function drawDemo(c, l, t) { var w = l.w, h = l.h, pad = l.pad, fs = Math.max(11, Math.min(20, w / 40, h / 30)), sw = Math.min((w - pad * 5) / 4, fs * 10), gap = (w - sw * 4) / 5, st = h * .035, sh = Math.min(h * .36, fs * 9.5);

      c.fillStyle = INK; font(c, fs * 1.1, true, true); c.fillText('Stall ' + s[0], X + sw / 2, sy + fs * 1.15, sw * .74); font(c, fs * .92, true); c.fillText('pays ' + s[1] + ' coins', X + sw / 2, sy + fs * 2.3, sw * .74); font(c, fs * .92); c.fillText('rent ' + s[2] + ' coins', X + sw / 2, sy + fs * 3.4, sw * .74);
      if (best) { c.strokeStyle = '#ffb23e'; c.lineWidth = 3; rr(c, X - 3, st - 2, sw + 6, sh + 4, 8); c.stroke(); } });
    /* Tavi's cart: two baskets of fruit */
    var cs = fs * 1.4, cy = st + sh + fs * 1.9, cxp = gap; c.fillStyle = '#8a5a2a'; rr(c, cxp, cy, cs * 4.4, cs * 1.1, 5); c.fill(); ol(c, 1.5);

    c.fillStyle = '#4a3a2a'; circ(c, cxp + cs * .9, cy + cs * 1.2, cs * .3); c.fill(); circ(c, cxp + cs * 3.5, cy + cs * 1.2, cs * .3); c.fill();
    c.fillStyle = '#ffd98a'; font(c, fs, true); c.textAlign = 'left'; c.fillText('Tavi\'s cart holds 2 baskets. She has 10 coins for rent.', cxp + cs * 4.8, cy + cs * .55, w - cxp - cs * 4.8 - pad);

    c.fillStyle = '#7a5a3a'; font(c, pfs * .9, true, true); c.fillText('TAVI\'S PAPER', px + pfs, py + lh * .7);
    DEMO.lines.forEach(function (s, k) { c.fillStyle = k === n - 1 ? '#1c6a30' : /Too much/.test(s) ? '#a3261e' : '#1a2a48'; font(c, pfs, k === n - 1); c.fillText(s, px + pfs, py + lh * (k + 1.6), pw - pfs * 2); });

  /* a tap on the picture: a planet on the board, or its card */
  function tap(x, y) { if (!OPEN || S.step !== 'plan' || !S.board) return false; var l = lay(), o = offers();

    if (best >= 0) { toggle(best); return true; } return false; }

  /* the planets a child has sold to, and Planet R once they have flown there: for the game, if it lets trading open the small worlds (a choice for the main thread) */
  function visited(state) { var out = []; ((state || {}).log || []).forEach(function (e) { if (e.kind === 'trade') e.route.forEach(function (r) { if (out.indexOf(r[0]) < 0) out.push(r[0]); }); if (e.kind === 'stone' && out.indexOf(K.stone) < 0) out.push(K.stone); }); return out; }
  return { open: open, frame: frame, tap: tap, isOpen: function () { return OPEN; }, visited: visited, rule: RULE, demo: DEMO, _state: function () { return S; } };
})();
